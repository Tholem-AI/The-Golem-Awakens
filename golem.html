/* ══════════════════════════════════════════════════
   1. SETUP & CONSTANTS
   ══════════════════════════════════════════════════ */

const C = document.getElementById('c');
const X = C.getContext('2d');
const W = 800, H = 480, T = 32;
C.width = W; C.height = H;

/* ── Tile types ── */
const AIR=0, WALL=1, PIT=2, GOLEM_SPAWN=3, DOOR_D=4, GLYPH=5, CRACKED=7, PLATFORM=8, END_PORTAL=9, MAGICAL_WALL=10, PUSH_SPAWN=11;

/* ── Dash constants ── */
const DASH_CHARGE_MAX = 180;       // frames (3 seconds at 60fps)
const DASH_DISTANCE_MIN = 60;      // px — minimum dash distance
const DASH_DISTANCE_MAX = 267;     // px — ~1/3 of 800px chamber
const DASH_DURATION = 10;          // frames — how long dash executes
const DASH_COOLDOWN = 20;          // frames after dash before next charge
const DASH_CHARGE_RING_MIN = 8;    // px — minimum indicator radius
const DASH_CHARGE_RING_MAX = 40;   // px — maximum indicator radius
const PUSH_SPEED = 1.25;           // px/frame — half of walk speed 2.5

/* ── Particle color constants (extracted from call sites) ── */
const DASH_EXEC_PARTICLE_COLOR = 'rgba(220,120,255,0.4)';  // A2
const DASH_CHARGE_PARTICLE_COLOR = 'rgba(180,80,255,0.4)'; // A2

/* ── Player physics constants ── */
const H_ACCEL_GROUND = 0.05;    // horizontal acceleration on ground
const H_ACCEL_AIR = 0.2;        // horizontal acceleration in air
const H_FRICTION = 0.225;       // horizontal deceleration
const GRAVITY = 0.07;           // gravity per frame
const TERMINAL_VEL = 2.5;       // terminal velocity (both X and Y)
const JUMP_VEL_1 = -5;          // first jump velocity
const JUMP_VEL_2 = -4.33;       // double jump velocity
const JUMP_CUT_VEL = -2;        // variable jump cut velocity (release to short-hop)
const COYOTE_FRAMES = 12;       // coyote time in frames (200ms)
const JUMP_BUFFER_FRAMES = 12;  // jump buffer in frames (200ms)
const CHARGE_FRICTION = 0.85;   // dash charge state friction

/* ── Push block physics constants ── */
const PB_GRAVITY = 0.3;         // push block gravity
const PB_TERMINAL_VEL = 4;      // push block terminal velocity
const PB_FRICTION = 0.85;       // push block friction
const PB_STOP_THRESH = 0.1;     // push block velocity threshold to stop

/* ── Message system constants ── */
const MSG_FADE_IN_FRAMES   = 180;
const MSG_FADE_OUT_FRAMES  = 180;
const MSG_MAX_QUEUE_DEPTH  = 5;
const MSG_CHARS_PER_FRAME  = 0.35;
const MSG_MIN_HOLD         = 90;
const MSG_MAX_HOLD         = 360;
const MSG_FOREVER_THRESHOLD = 99999;

/* ── Static UI arrays (hoisted from render, B2+B3) ── */
const ABILITIES = [
  ['[1] Double Jump', 1], ['[2] Dash (Shift)', 2],
  ['[3] Push Blocks', 3], ['[4] Break Cracked', 4]
];
const CHAMBER_NAMES = ['Awakening','The Library','The Hall of Echoes','The Weight of Wisdom','The Ibis Chamber'];
const CHAMBER_FLOW = ['ch0','ch1','ch2','ch3','ch4'];

/* ══════════════════════════════════════════════════
   HELPER FUNCTIONS (extracted from duplicated patterns)
   ══════════════════════════════════════════════════ */

/* A4: Snap player X to tile boundary after collision */
function snapToTileX(gx1, gx2, prevX) {
  if(P.vx>0){ P.x=gx2*T-P.w; }
  else if(P.vx<0){ P.x=(gx1+1)*T; }
  else { P.x=prevX; }
}

/* A5: End dash state cleanly */
function endDash() {
  P.dashing=false; P.dashTimer=0; P.dashCooldown=DASH_COOLDOWN; P.dashPhase=false;
}

/* A6: Land on ground — reset jumps and coyote */
function land() {
  P.onGround=true; P.jumps=0; P.coyoteTime=COYOTE_FRAMES;
}

/* ── Easing functions for death/respawn animations ── */
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
function easeOutBack(t) { const c1=1.70158; const c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }

/* A3: Kill and respawn player at checkpoint */
function killAndRespawn(onGround, msg, duration) {
  if(animState!=='idle') return; // prevent double-trigger
  P.dashing=false; P.dashTimer=0;
  animState='dying'; animFrame=0;
  showMessage(msg, duration);
}

/* ══════════════════════════════════════════════════
   2. CHAMBER DATA (Level data)
   ══════════════════════════════════════════════════ */

function mkGrid(w,h) { let g=[]; for(let y=0;y<h;y++) g[y]=new Array(w).fill(AIR); return g; }

const chambers = [];

// Chamber 0: Awakening — learn movement, get Glyph 1 (Double Jump)

 chambers.push({w,h,tiles:g,glyphs:[{x:17,y:8}],

chambers.push({w,h,tiles:g,glyphs:[],flowId:'ch4'});

/* ══════════════════════════════════════════════════
   3. ENTITIES
   ══════════════════════════════════════════════════ */

/* ── Player state ── */
const P = {
  x:0, y:0, vx:0, vy:0, w:24, h:28,
  onGround:false, jumps:0, maxJumps:1,
  canDash:false, dashing:false, dashTimer:0, dashDir:0, dashCooldown:0, dashPhase:false, dashCharge:0,
  canPush:false, canBreak:false,
  facing:1, chamber:0, respawnX:0, respawnY:0,
  coyoteTime:0, jumpBuffer:0,
  pushing:false
};

/* ── Push block entity (free-moving physics object) ── */
const PB = {
  x:0, y:0, w:T, h:T,
  vx:0, vy:0,
  active:false, inSlot:false
};

/* ── Game state globals ── */
let glyphsCollected = 0;
let collectedGlyphs = [];          // per-chamber boolean
let gameState = 'playing';
let screenFade = 0;                // 0=off, 1=fade-in, -1=fade-out
let screenAlpha = 0;
let messageQueue = [];
let portalLockMsg = 0;             // cooldown for locked-portal message
let particles = [];
let testChamberSrc = -1;           // remembers which chamber we came from for test exit
let _testMode = false;             // set by test harness for instant transitions
let _c;                            // cached chambers[P.chamber] for getTile optimization
let _transitionTarget = -1;        // stores target chamber during async fade cycle
let animState = 'idle';            // 'idle' | 'dying' | 'respawning'
let animFrame = 0;
const ANIM_TOTAL_FRAMES = 90;      // 1.5s at 60fps

/* ══════════════════════════════════════════════════
   4. INPUT
   ══════════════════════════════════════════════════ */

let keys = {};
let prevKeys = {};

document.addEventListener('keydown', function(e){
  keys[e.code] = true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyW','KeyA','KeyS','KeyD','ShiftLeft','ShiftRight'].includes(e.code))
    e.preventDefault();
});
document.addEventListener('keyup', function(e){ keys[e.code] = false; });

function fresh(code){ return keys[code] && !prevKeys[code]; }

function shiftHeld(){ return keys['ShiftLeft']||keys['ShiftRight']; }

/* A7: Input normalization abstractions */
function inputLeft()         { return keys['ArrowLeft']  || keys['KeyA']; }
function inputRight()        { return keys['ArrowRight'] || keys['KeyD']; }
function inputJumpPressed()  { return fresh('ArrowUp')||fresh('KeyW')||fresh('Space'); }
function inputJumpHeld()     { return keys['ArrowUp'] || keys['KeyW'] || keys['Space']; }
function inputShiftPressed() { return fresh('ShiftLeft')||fresh('ShiftRight'); }
function inputDown()         { return keys['ArrowDown']  || keys['KeyS']; }

/* ══════════════════════════════════════════════════
   5. TILE HELPERS & COLLISION
   ══════════════════════════════════════════════════ */

function getTile(ch,x,y){
  const c=chambers[ch];
  if(x<0||x>=c.w||y<0||y>=c.h) return WALL;
  return c.tiles[y][x];
}
function setTile(ch,x,y,v){
  const c=chambers[ch];
  if(x>=0&&x<c.w&&y>=0&&y<c.h){
    const old=c.tiles[y][x];
    c.tiles[y][x]=v;
    if(old!==AIR && v===AIR){
      const idx=c.solidTiles.findIndex(t=>t.x===x&&t.y===y);
      if(idx>=0) c.solidTiles.splice(idx,1);
    } else if(old===AIR && v!==AIR){
      c.solidTiles.push({x,y});
    }
  }
}

/* Fast tile access — uses pre-cached _c (set at update/render entry) */
function _getTile(x,y){
  if(x<0||x>=_c.w||y<0||y>=_c.h) return WALL;
  return _c.tiles[y][x];
}

/* Solid for walls/blocks/doors/end-portal (not one-way platforms) */
function solid(t){ return t===WALL||t===CRACKED||t===DOOR_D||t===END_PORTAL||t===MAGICAL_WALL; }

/* Platform is solid ONLY when player feet were at/above platform top (true one-way).
   prevFeet = previous feet bottom (prevY+P.h). gy = platform tile row. */
function platSolid(t, prevFeet, gy){
  if(t!==PLATFORM) return false;
  if(inputDown()) return false;
  return prevFeet <= gy * T + 2;
}

/* Unified tile collision checker — grid-space iteration with configurable options.
   Options: {skipTileType: tileValue, includePlatforms: bool, prevY: px, curY: px} */
function tileCollidesRect(ch, gx1, gy1, gx2, gy2, opts) {
  for(let gy=gy1;gy<=gy2;gy++)
    for(let gx=gx1;gx<=gx2;gx++){
      const t=getTile(ch,gx,gy);
      if(opts.skipTileType && t===opts.skipTileType) continue;
      if(solid(t)) return true;
      if(opts.includePlatforms && platSolid(t, opts.prevY + P.h, gy)) return true;
    }
  return false;
}

/* collides: for Y movement — check solid tiles + platforms at the NEW position */
function collides(gx1,gy1,gx2,gy2,ch,prevY,curY) {
  return tileCollidesRect(ch, gx1, gy1, gx2, gy2, {includePlatforms:true, prevY, curY});
}

/* collidesNoPlat: for X movement — solid tiles only, no platforms */
function collidesNoPlat(gx1,gy1,gx2,gy2,ch) {
  return tileCollidesRect(ch, gx1, gy1, gx2, gy2, {});
}

/* collidesDash: skips MAGICAL_WALL + checks push-block AABB */
function collidesDash(gx1,gy1,gx2,gy2,ch,prevY,curY) {
  if(tileCollidesRect(ch, gx1, gy1, gx2, gy2, {skipTileType:MAGICAL_WALL, includePlatforms:true, prevY, curY})) return true;
  /* Push block during dash */
  if(PB.active){
    const x1=gx1*T, x2=(gx2+1)*T;
    if(aabb(x1, prevY, x2-x1, P.h, PB.x, PB.y, PB.w, PB.h)) return true;
  }
  return false;
}

function inPit(){
  const px=P.x+P.w/2, py=P.y+P.h/2;
  const gx=Math.floor(px/T), gy=Math.floor(py/T);
  const thresh=1.1*T;
  for(let dy=-1;dy<=1;dy++)
    for(let dx=-1;dx<=1;dx++){
      if(_getTile(gx+dx,gy+dy)!==PIT) continue;
      const tpx=(gx+dx+0.5)*T, tpy=(gy+dy+0.5)*T;
      const dist=Math.abs(px-tpx)+Math.abs(py-tpy);
      if(dist<thresh) return true;
    }
  return false;
}

/* AABB overlap test */
function aabb(ax,ay,aw,ah, bx,by,bw,bh){
  return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
}

/* Check if AABB overlaps any solid tile */
function tileCollides(ch, x, y, w, h){
  const x1=Math.floor(x/T), x2=Math.floor((x+w-1)/T);
  const y1=Math.floor(y/T), y2=Math.floor((y+h-1)/T);
  for(let gy=y1;gy<=y2;gy++)
    for(let gx=x1;gx<=x2;gx++)
      if(solid(getTile(ch,gx,gy))) return true;
  return false;
}

/* ══════════════════════════════════════════════════
   6. PUSH BLOCK SYSTEM
   ══════════════════════════════════════════════════ */

function resetPushBlock(){
  const c=chambers[P.chamber];
  if(!c || !c.pushSpawn){ PB.active=false; return; }
  PB.x = c.pushSpawn.x * T;
  PB.y = c.pushSpawn.y * T;
  PB.vx = 0; PB.vy = 0;
  PB.active = true;
  PB.inSlot = false;
}

/* Push block: resolve AFTER normal X movement + tile collision.
   Detect push overlap and apply velocity-based movement (not instant teleport). */
function resolvePushBlockCollision(){
  if(!P.canPush || !PB.active || PB.inSlot) return;
  if(!aabb(P.x, P.y, P.w, P.h, PB.x, PB.y, PB.w, PB.h)) return;

  const centerP = P.x + P.w / 2;
  const centerB = PB.x + PB.w / 2;
  const dir = (centerP < centerB) ? 1 : -1;

  const movingToward = (P.vx * dir > 0.1);

  // Y-overlap guard: skip X separation when player is landing on top
  const isOnTop = P.y < PB.y
                 && P.y + P.h >= PB.y - 8
                 && P.y + P.h <= PB.y + P.h / 2;

  if(P.onGround && movingToward){
    // ── Active push: velocity-based ──
    P.pushing = true;

    // Apply push velocity to the block (half walk speed)
    PB.vx = dir * PUSH_SPEED;

    // Clamp golem to same push speed (don't zero, just limit)
    if(Math.abs(P.vx) > PUSH_SPEED) P.vx = dir * PUSH_SPEED;

    // Keep golem glued to block side (smooth, no snap)
    if(dir > 0) P.x = Math.min(P.x, PB.x - P.w + 1);
    else        P.x = Math.max(P.x, PB.x + PB.w - 1);

    Particles.spawn(P.x + P.w/2, P.y + P.h - 4, '#d4a84b', 2);

  } else if(movingToward && !P.onGround){
    // Requirement 5: no push while airborne — separate
    if(dir > 0) P.x = PB.x - P.w;
    else        P.x = PB.x + PB.w;

  } else {
    // Not pushing — static separation (walking past, standing against)
    if(isOnTop) return; // let Y landing check handle this
    if(centerP < centerB) P.x = PB.x - P.w;
    else                  P.x = PB.x + PB.w;
  }
}

/* Push block: separate X then Y with gravity */
function updatePushBlock(){
  const ch=P.chamber;
  const c=chambers[ch];
  if(!c || !c.pushSpawn) return;
  if(PB.inSlot) return;           // frozen in slot (still visible + rendered)

  if(!PB.active){
    resetPushBlock();
    return;
  }

  /* Move X */
  PB.x += PB.vx;
  if(tileCollides(ch, PB.x, PB.y, PB.w, PB.h)){
    if(PB.vx>0) PB.x = Math.floor((PB.x+PB.w)/T)*T - PB.w;
    else        PB.x = (Math.floor(PB.x/T)+1)*T;
    PB.vx = 0;
  }

  /* Move Y (gravity) */
  PB.vy += PB_GRAVITY;
  if(PB.vy>PB_TERMINAL_VEL) PB.vy=PB_TERMINAL_VEL;
  PB.y += PB.vy;
  if(tileCollides(ch, PB.x, PB.y, PB.w, PB.h)){
    if(PB.vy>0) PB.y = Math.floor((PB.y+PB.h)/T)*T - PB.h;
    else        PB.y = (Math.floor(PB.y/T)+1)*T;
    PB.vy = 0;
  }

 /* Friction (skip when player is actively pushing) */
  if(!P.pushing){
    PB.vx *= PB_FRICTION;
    if(Math.abs(PB.vx)<PB_STOP_THRESH) PB.vx=0;
  }

  /* Check if block fell into slot — settle visibly in the hole */
  const cx=Math.floor((PB.x+PB.w/2)/T);
  const cy=Math.floor((PB.y+PB.h/2)/T);
  if(c.pushSlot && cx===c.pushSlot.gx && cy===c.pushSlot.gy){
    PB.x = c.pushSlot.gx * T;
    PB.y = c.pushSlot.gy * T;
    PB.vx = 0;
    PB.vy = 0;
    PB.inSlot = true;
    Particles.spawn((c.pushSlot.gx + 0.5)*T, PB.y + PB.h/2, '#d4a84b', 12);
    showMessage("The weight settles.",80);
  }

  /* Reset if fallen past bottom */
  if(PB.y > c.h*T){
    PB.x = c.pushSpawn.x*T; PB.y = c.pushSpawn.y*T;
    PB.vx=0; PB.vy=0; PB.inSlot=false;
  }
}

/* ══════════════════════════════════════════════════
   7. PARTICLE SYSTEM (IIFE — encapsulated module)
   ══════════════════════════════════════════════════ */

const Particles = (function(){
  /* Reference the global particles array — same array, encapsulated API */
  const pool = particles;

  function shatter(x,y){
    /* Chunky debris — fast, heavy */
    for(let i=0;i<12;i++)
      pool.push({x,y,
        vx:(Math.random()-0.5)*8, vy:-Math.random()*5-2,
        life:25+Math.random()*20, maxLife:45,
        color:['#c86040','#a04030','#d08060','#e0a070'][i%4],
        size:3+Math.random()*4});
    /* Dust cloud — slow, diffuse */
    for(let i=0;i<10;i++)
      pool.push({x,y,
        vx:(Math.random()-0.5)*3, vy:-Math.random()*2,
        life:15+Math.random()*10, maxLife:25,
        color:'rgba(200,160,100,0.5)',
        size:2+Math.random()*2});
    /* Spark flash */
    for(let i=0;i<6;i++)
      pool.push({x,y,
        vx:(Math.random()-0.5)*6, vy:(Math.random()-0.5)*6,
        life:8+Math.random()*6, maxLife:14,
        color:'#ffe0a0',
        size:1+Math.random()*2});
  }

  function spawn(x,y,color,count){
    for(let i=0;i<count;i++)
      pool.push({
        x, y,
        vx:(Math.random()-0.5)*4,
        vy:-Math.random()*3-1,
        life:20+Math.random()*15,
        maxLife:35,
        color,
        size:2+Math.random()*3
      });
  }

  function update(){
    for(let i=pool.length-1;i>=0;i--){
      const p=pool[i];
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.1; p.life--;
      if(p.life<=0) pool.splice(i,1);
    }
  }

  return { spawn, shatter, update };
})();

/* ══════════════════════════════════════════════════
   8. GAME FLOW (transitions, doors, glyphs)
   ══════════════════════════════════════════════════ */

/* ── Message queue system ── */
function calcDisplayDuration(text, providedDur) {
    const auto = Math.floor(text.length / MSG_CHARS_PER_FRAME);
    const dur = providedDur || MSG_MIN_HOLD;
    return Math.min(MSG_MAX_HOLD, Math.max(dur, auto));
}
function showMessage(txt, dur) {
    const isForever = (dur || 0) >= MSG_FOREVER_THRESHOLD;
    if (isForever) {
        messageQueue = [{ text: txt, hold: dur || MSG_FOREVER_THRESHOLD, phase: 'display', elapsed: 0 }];
        return;
    }
    if (messageQueue.length > 0 && messageQueue[0].text === txt) return;
    if (messageQueue.length < MSG_MAX_QUEUE_DEPTH) {
        messageQueue.push({ text: txt, hold: calcDisplayDuration(txt, dur), phase: 'fadeIn', elapsed: 0 });
    }
}

/* ── Transition with screen fade ── */
function _doTransition(toChamber){
  P.chamber = toChamber;
  const nc = chambers[toChamber];
  P.x = nc.spawnPx; P.y = nc.spawnPy;
  P.respawnX = nc.spawnPx; P.respawnY = nc.spawnPy;
  P.vx=0; P.vy=0; P.jumps=0;
  P.dashing=false; P.dashTimer=0; P.dashCooldown=0; P.dashPhase=false; P.dashCharge=0;
  P.onGround=false; P.coyoteTime=0;
  P.pushing=false;
  resetPushBlock();
}
function transition(toChamber){
  if(animState!=='idle') return; // don't interrupt death/respawn
  if(_testMode){ _doTransition(toChamber); return; }
  _transitionTarget = toChamber;
  screenFade = 1;
  screenAlpha = 0;
}

function checkDoors(){
  const ch=P.chamber, c=chambers[ch];
  const px=P.x+P.w/2, py=P.y+P.h/2;
  const gx=Math.floor(px/T), gy=Math.floor(py/T);
  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
    const t=_getTile(gx+dx,gy+dy);
    if(t===DOOR_D){
      /* Return from test chamber (no flowId) */
      if(!c.flowId && testChamberSrc >= 0){
        transition(testChamberSrc);
        return;
      }
      /* Follow flow for main chambers */
      if(collectedGlyphs[ch]){
        const fi = CHAMBER_FLOW.indexOf(c.flowId);
        if(fi >= 0 && fi < CHAMBER_FLOW.length - 1){
          /* Find chamber index by flowId of next in flow */
          const nextFlow = CHAMBER_FLOW[fi+1];
          for(let i=0;i<chambers.length;i++){
            if(chambers[i].flowId === nextFlow){ transition(i); return; }
          }
        }
      } else {
        if(portalLockMsg<=0){
          showMessage("The seal demands Knowledge...", 70);
          portalLockMsg = 45;
        }
      }
      return;
    }
    if(t===END_PORTAL){
      transitionEnding();
      return;
    }
  }
}

function checkGlyphs(){
  const ch=P.chamber, c=chambers[ch];
  if(collectedGlyphs[ch]) return;
  const px=P.x+P.w/2, py=P.y+P.h/2;
  const gx=Math.floor(px/T), gy=Math.floor(py/T);
  for(let i=0;i<c.glyphs.length;i++){
    const gl=c.glyphs[i];
    if(_getTile(gl.x,gl.y)!==GLYPH) continue;
    if(Math.abs(gx-gl.x)<=1 && Math.abs(gy-gl.y)<=1){
      if(glyphsCollected!==ch) continue;
      setTile(ch,gl.x,gl.y,AIR);
      collectedGlyphs[ch]=true;
      glyphsCollected++;
      Particles.spawn((gl.x+0.5)*T,(gl.y+0.5)*T,'#f0d060',15);
      if(glyphsCollected===1){ P.maxJumps=2; showMessage("Knowledge lifts me.",120); }
      else if(glyphsCollected===2){ P.canDash=true; showMessage("Speed courses through me.",120); }
      else if(glyphsCollected===3){ P.canPush=true; showMessage("Strength returns.",120); }
      else if(glyphsCollected===4){ P.canBreak=true; showMessage("Clay becomes Wisdom.",120); }
    }
  }
}

function transitionEnding(){
  if(animState!=='idle') return;
  if(_testMode){ gameState='ending'; showMessage("The Ibis speaks: 'You were clay. Now you are Wisdom.'",99999); return; }
  screenFade=1; screenAlpha=0;
  setTimeout(function(){
    gameState='ending';
    showMessage("The Ibis speaks: 'You were clay. Now you are Wisdom.'",99999);
  },300);
}

/* ══════════════════════════════════════════════════
   9. UPDATE — physics, input, game logic
   ══════════════════════════════════════════════════ */
function update(){
  if(gameState==='ending') return;
  if(animState!=='idle'){ updateAnim(); return; }
  _c=chambers[P.chamber]; // cache chamber ref for fast getTile

 /* Test chamber entry/exit — press T */
  if(fresh('KeyT')){
    const c = chambers[P.chamber];
    if(!c.flowId && testChamberSrc >= 0){
      /* Return from test chamber */
      transition(testChamberSrc);
      showMessage("Back to chamber " + testChamberSrc + ".", 60);
    } else {
      /* Enter test chamber */
      testChamberSrc = P.chamber;
      glyphsCollected = 4;
      P.maxJumps = 2;
      P.canDash = true;
      P.canPush = true;
      P.canBreak = true;
      /* Find test chamber by absence of flowId */
      for(let i=0;i<chambers.length;i++){
        if(!chambers[i].flowId){ transition(i); break; }
      }
      showMessage("Test chamber — all abilities unlocked.", 90);
    }
    return;
  }

  /* Screen fade */
  if(screenFade===1){ screenAlpha+=0.06; if(screenAlpha>=1){screenAlpha=1; if(_transitionTarget>=0){_doTransition(_transitionTarget);_transitionTarget=-1;} screenFade=-1;} }
  if(screenFade===-1){ screenAlpha-=0.06; if(screenAlpha<=0){screenAlpha=0;screenFade=0;} }
  if(screenFade===1) return;

  if(messageQueue.length>0){const m=messageQueue[0];m.elapsed++;if(m.phase==='fadeIn'&&m.elapsed>=MSG_FADE_IN_FRAMES){m.phase='display';m.elapsed=0;}else if(m.phase==='display'&&m.elapsed>=m.hold){m.phase='fadeOut';m.elapsed=0;}else if(m.phase==='fadeOut'&&m.elapsed>=MSG_FADE_OUT_FRAMES){messageQueue.shift();}}
  if(portalLockMsg>0) portalLockMsg--;

  /* ── Dash: charge on hold, execute on release ── */
  const isCharging = P.dashCharge > 0;

  /* ── Horizontal input (acceleration + friction) ── */
  let inputX = 0;
  if(inputLeft()) inputX=-1;
  if(inputRight()) inputX=1;
  if(inputX!==0) P.facing=inputX;  /* facing always updates — allows aiming dash */

  if(!isCharging && !P.dashing){
    if(inputX!==0){
      P.vx += inputX * (P.onGround ? H_ACCEL_GROUND : H_ACCEL_AIR);
      if(Math.abs(P.vx)>TERMINAL_VEL) P.vx = inputX*TERMINAL_VEL;
    } else {
      if(P.vx>0) P.vx = Math.max(0, P.vx-H_FRICTION);
      else if(P.vx<0) P.vx = Math.min(0, P.vx+H_FRICTION);
    }
  }

  if(isCharging){
    /* Charging state: gravity and velocity heavily slowed (1/10th) */
    P.vy = P.vy * 0.1 + 0.007;  /* 1/10th existing velocity + 1/10th normal gravity */
    P.vx *= CHARGE_FRICTION;

    if(!shiftHeld()){
      /* Shift released — execute dash */
      const chargeRatio = P.dashCharge / DASH_CHARGE_MAX;
      const dashDist = DASH_DISTANCE_MIN + (DASH_DISTANCE_MAX - DASH_DISTANCE_MIN) * chargeRatio;
      const moveFrames = DASH_DURATION;
      const dashSpeed = dashDist / moveFrames;

      P.dashing = true;
      P.dashTimer = DASH_DURATION;
      P.dashDir = P.facing;
      P.dashPhase = true;
      P.dashCharge = 0;

      P.vx = P.dashDir * dashSpeed;
      P.vy = 0;

      Particles.spawn(P.x+P.w/2, P.y+P.h/2, 'rgba(220,120,255,0.6)', 6);
    } else {
      /* Still holding — accumulate charge */
      if(P.dashCharge < DASH_CHARGE_MAX){
        P.dashCharge++;
      }
      /* Charge particles */
      Particles.spawn(P.x+P.w/2, P.y+P.h/2, DASH_CHARGE_PARTICLE_COLOR, 2);
    }
  } else if(P.canDash && !P.dashing && P.dashCooldown<=0){
    /* Start charging on Shift press */
    if(inputShiftPressed()){
      P.dashCharge = 1;  /* Start charging — at least 1 frame */
    }
  }

  /* Dash execution */
  if(P.dashing){
    P.vx = P.dashDir * (P.vx !== 0 ? Math.abs(P.vx) : 10);
    P.vy = 0;
    P.dashTimer--;
    Particles.spawn(P.x+P.w/2, P.y+P.h/2, DASH_EXEC_PARTICLE_COLOR, 2);
    if(P.dashTimer<=0){
      endDash();
      const cx=Math.floor((P.x+P.w/2)/T), cy=Math.floor((P.y+P.h/2)/T);
      if(_getTile(cx,cy)===MAGICAL_WALL){
        killAndRespawn(true, "The barrier consumes you...", 90);
      }
    }
  }
  if(P.dashCooldown>0) P.dashCooldown--;

  /* ── Gravity (only when airborne) ── */
  if(!isCharging && !P.onGround){
    P.vy += GRAVITY;
  }
  if(P.vy>TERMINAL_VEL) P.vy=TERMINAL_VEL;

  /* ── Coyote time countdown ── */
  if(P.coyoteTime>0) P.coyoteTime--;

  /* ── Move X + collide (tiles first, then push-block entity) ── */
  P.pushing = false;
  const prevX = P.x;
  P.x += P.vx;

  /* 1. Resolve against static tiles */
  {
    const gx1=Math.floor(P.x/T), gx2=Math.floor((P.x+P.w-1)/T);
    const gy1=Math.floor(P.y/T), gy2=Math.floor((P.y+P.h-1)/T);
    const colFn = P.dashPhase ? collidesDash : collidesNoPlat;
    if(colFn(gx1,gy1,gx2,gy2,P.chamber,P.y)){
      if(P.dashPhase){
        const fcx=Math.floor((P.x+(P.vx>0?P.w:0))/T), fcy=Math.floor((P.y+P.h/2)/T);
        if(_getTile(fcx,fcy)===CRACKED && P.canBreak){
          setTile(P.chamber,fcx,fcy,AIR);
          Particles.shatter((fcx+0.5)*T,(fcy+0.5)*T);
          endDash();
          P.vx=0;
        } else {
          snapToTileX(gx1, gx2, prevX);
          P.vx=0;
        }
      } else {
        snapToTileX(gx1, gx2, prevX);
        P.vx=0;
      }
    }
  }

/* 2. Resolve against push-block entity */
  resolvePushBlockCollision();

  /* Update push block physics while P.pushing flag is still valid */
  updatePushBlock();

 /* ── Move Y + collide (platforms = one-way) ── */
  const prevY = P.y;
  P.y += P.vy;
  {
    const gx1=Math.floor(P.x/T), gx2=Math.floor((P.x+P.w-1)/T);
    const gy1=Math.floor(P.y/T), gy2=Math.floor((P.y+P.h)/T);
    const colFn = P.dashPhase ? collidesDash : collides;
  if(colFn(gx1,gy1,gx2,gy2,P.chamber,prevY,P.y)){
      if(P.vy>0){
        P.y=gy2*T-P.h;
        P.vy=0;
        land();
        if(prevY+P.h < gy2*T - 4)
          Particles.spawn(P.x+P.w/2, P.y+P.h, '#8a7d6b', 4);
      } else if(P.vy<0){
        P.y=(gy1+1)*T;
        P.vy=0;
      }
    } else {
      P.onGround = false;
    }
    /* Push block Y collision — land on top */
    if(PB.active){
     if(aabb(P.x, P.y, P.w, P.h, PB.x, PB.y, PB.w, PB.h) && P.vy > 0 && Math.abs(P.vx) < 3){
        if(prevY + P.h <= PB.y + 2){
          P.y = PB.y - P.h;
          P.vy = 0;
          land();
        }
      }
    }
  }

  /* ── Jump buffer countdown ── */
  if(P.jumpBuffer>0 && !P.onGround) P.jumpBuffer--;

  /* ── Jump (fresh press only, variable height, buffered) ── */
  const jumpPressed = inputJumpPressed();
  const jumpHeld = inputJumpHeld();
  const jx=P.x+P.w/2, jy=P.y+P.h; // A1: precompute jump particle coords

  if(P.onGround && P.jumpBuffer>0 && P.jumps<P.maxJumps){
    P.vy = P.jumps===0 ? JUMP_VEL_1 : JUMP_VEL_2;
    P.jumps++;
    P.onGround=false;
    P.coyoteTime=0;
    P.jumpBuffer=0;
    Particles.spawn(jx, jy, '#8a7d6b', 5);
  }
  else if(jumpPressed && P.jumps===0 && P.coyoteTime>0){
    P.vy = JUMP_VEL_1;
    P.jumps++;
    P.onGround=false;
    P.coyoteTime=0;
    P.jumpBuffer=0;
    Particles.spawn(jx, jy, '#8a7d6b', 5);
  }
  else if(jumpPressed && P.jumps < P.maxJumps && P.jumps>0){
    P.vy = JUMP_VEL_2;
    P.jumps++;
    P.jumpBuffer=0;
    Particles.spawn(jx, jy, '#d4a84b', 8);
  }
  else if(jumpPressed && P.jumps < P.maxJumps){
    P.jumpBuffer = JUMP_BUFFER_FRAMES;
  }

  /* Variable jump height: cut upward velocity on release */
  if(!jumpHeld && P.vy < JUMP_CUT_VEL) P.vy = JUMP_CUT_VEL;

  /* ── Pit / out-of-bounds death ── */
  if(inPit() || P.y > chambers[P.chamber].h*T){
    P.dashing=false; P.dashTimer=0;
    killAndRespawn(false, "The void claims clay...", 90);
    resetPushBlock();
  }

  checkDoors();
  checkGlyphs();
  Particles.update();

 for(const k in keys) prevKeys[k]=keys[k];
  for(const k in prevKeys) if(!keys[k]) delete prevKeys[k];
}

/* ══════════════════════════════════════════════════
   ANIM UPDATE — runs during death/respawn animations
   ══════════════════════════════════════════════════ */
function updateAnim(){
  _c = chambers[P.chamber]; // keep chamber cache valid for render
  // Advance message queue
  if(messageQueue.length>0){
    const m=messageQueue[0];
    m.elapsed++;
    if(m.phase==='fadeIn' && m.elapsed>=MSG_FADE_IN_FRAMES){
      m.phase='display'; m.elapsed=0;
    } else if(m.phase==='display' && m.elapsed>=m.hold){
      m.phase='fadeOut'; m.elapsed=0;
    } else if(m.phase==='fadeOut' && m.elapsed>=MSG_FADE_OUT_FRAMES){
      messageQueue.shift();
    }
  }
  if(portalLockMsg>0) portalLockMsg--;
  Particles.update();
  animFrame++;
  const progress = animFrame / ANIM_TOTAL_FRAMES;
  // Dying -> transition to respawning
  if(animState==='dying' && animFrame>=ANIM_TOTAL_FRAMES){
    P.x=P.respawnX; P.y=P.respawnY; P.vx=0; P.vy=0; P.jumps=0; P.dashCharge=0;
    animState='respawning'; animFrame=0;
    showMessage('Clay reforms...', 60);
  }
  // Respawning -> transition back to idle
  if(animState==='respawning' && animFrame>=ANIM_TOTAL_FRAMES){
    P.x=P.respawnX; P.y=P.respawnY; P.vx=0; P.vy=0; P.jumps=0; P.dashCharge=0;
    P.onGround=true; P.coyoteTime=COYOTE_FRAMES;
    P.dashing=false; P.dashTimer=0; P.dashCooldown=0; P.dashPhase=false;
    resetPushBlock();
    animState='idle'; animFrame=0;
  }
  // Copy prevKeys
  for(const k in keys) prevKeys[k]=keys[k];
  for(const k in prevKeys) if(!keys[k]) delete prevKeys[k];
}

/* ══════════════════════════════════════════════════
   10. RENDER
   ══════════════════════════════════════════════════ */
const COLORS = {
  bg:'#0d0d1a', wall:'#4a4035', wallTop:'#6b5d4f',
  platform:'#5a4d3a', pit:'#000000', door:'#2a5a3a',
  glyph:'#c8a84e', glyphGlow:'#f0d060',
  cracked:'#8a5040',
  golem:'#8a7d6b', golemDark:'#5a5040', golemEye:'#d4a84b',
 text:'#d4a84b', pushBlock:'#a08868', pushBlockTop:'#b8a080'
};

/* ── Death/Respawn animation renderer ── */
function renderDeathRespawnAnimation(ox, oy){
  const now = Date.now();
  const progress = animFrame / ANIM_TOTAL_FRAMES;
  const cx = ox + P.respawnX + P.w/2;
  const cy = oy + P.respawnY + P.h/2;
  const pw = P.w, ph = P.h;

  if(animState === 'dying'){
    // ── DEATH: parts spread outward with gravity, alpha fades, clay particles ──
    const p = easeOutCubic(progress);
    const alpha = 1 - progress;
    const spread = p * 80;

    // Spawn clay particles during first half
    if(animFrame % 4 === 0 && progress < 0.6){
      Particles.spawn(P.x + P.w/2, P.y + P.h/2, '#8a7d6b', 2);
    }

    X.save();
    X.globalAlpha = Math.max(0, alpha);

    // Head (spreads up)
    const headY = cy - ph/2 - spread * 0.8;
    X.fillStyle = COLORS.golem;
    X.fillRect(cx - pw/4 + Math.sin(animFrame*0.3)*spread*0.2, headY - 5, pw/2, 10);
    // Eye on head
    X.fillStyle = COLORS.golemEye;
    X.fillRect(cx + 2 + Math.sin(animFrame*0.3)*spread*0.2, headY - 2, 4, 3);

    // Torso (spreads center, slight rotation wobble)
    const torsoY = cy + spread * 0.1;
    const torsoOffX = Math.cos(animFrame*0.4)*spread*0.15;
    X.fillStyle = COLORS.golemDark;
    X.fillRect(cx - pw/3 + torsoOffX, torsoY - ph/3, pw*2/3, ph*2/3);
    X.fillStyle = COLORS.golem;
    X.fillRect(cx - pw/4 + torsoOffX, torsoY - ph/3 + 2, pw/2, ph*2/3 - 4);

    // Left arm (spreads left)
    const armY = cy + spread * 0.3 + Math.sin(animFrame*0.5)*spread*0.2;
    X.fillStyle = COLORS.golem;
    X.fillRect(cx - spread - 3, armY, 3, 10);

    // Right arm (spreads right)
    const arm2Y = cy + spread * 0.3 - Math.sin(animFrame*0.5)*spread*0.2;
    X.fillRect(cx + spread, arm2Y, 3, 10);

    // Legs (spread outward and down with gravity)
    const legY = cy + ph/2 + spread * 0.5;
    X.fillStyle = COLORS.golemDark;
    X.fillRect(cx - spread*0.7, legY, 7, 4);
    X.fillRect(cx + spread*0.7 - 7, legY, 7, 4);

    X.restore();

  } else if(animState === 'respawning'){
    // ── RESPAWN: parts materialize bottom-up (legs->arms->torso->head->eye->glyphs) ──
    const p = progress;
    const flash = p > 0.9 ? (p - 0.9) / 0.1 : 0; // final activation flash

    // Spawn reforming particles during first 60%
    if(animFrame % 3 === 0 && progress < 0.6){
      Particles.spawn(P.respawnX + P.w/2 + (Math.random()-0.5)*30,
                       P.respawnY + P.h + (Math.random()-0.5)*20, '#8a7d6b', 2);
    }

    // Clay pile at feet — shrinks as golem forms
    const pileSize = (1 - easeOutCubic(Math.min(1, p * 2))) * 15;
    if(pileSize > 1){
      X.fillStyle = 'rgba(138,125,107,' + (1 - p) * 0.5 + ')';
      X.beginPath();
      X.ellipse(cx, oy + P.respawnY + P.h + 2, pileSize + 5, pileSize/2, 0, 0, Math.PI*2);
      X.fill();
    }

    X.save();

    // Legs appear first (0-15%)
    if(p > 0.05){
      const legAlpha = Math.min(1, (p - 0.05) / 0.15);
      X.globalAlpha = legAlpha;
      X.fillStyle = COLORS.golemDark;
      X.fillRect(cx - pw/2 + 3, oy + P.respawnY + ph - 4, 7, 4);
      X.fillRect(cx + pw/2 - 10, oy + P.respawnY + ph - 4, 7, 4);
    }

    // Arms appear next (15-30%)
    if(p > 0.2){
      const armAlpha = Math.min(1, (p - 0.2) / 0.15);
      X.globalAlpha = armAlpha;
      X.fillStyle = COLORS.golem;
      X.fillRect(cx - pw/2 - 1, oy + P.respawnY + 10, 3, 10);
      X.fillRect(cx + pw/2 - 2, oy + P.respawnY + 10, 3, 10);
    }

    // Torso (30-50%)
    if(p > 0.35){
      const torsoAlpha = Math.min(1, (p - 0.35) / 0.15);
      X.globalAlpha = torsoAlpha;
      X.fillStyle = COLORS.golemDark;
      X.fillRect(cx - pw/2 + 4, oy + P.respawnY + 6, pw - 8, ph - 10);
      X.fillStyle = COLORS.golem;
      X.fillRect(cx - pw/2 + 2, oy + P.respawnY + 4, pw - 4, ph - 4);
    }

    // Head (50-65%)
    if(p > 0.5){
      const headAlpha = Math.min(1, (p - 0.5) / 0.15);
      X.globalAlpha = headAlpha;
      X.fillStyle = COLORS.golem;
      X.fillRect(cx - pw/4, oy + P.respawnY, pw/2, 10);
    }

    // Eye (65-75%)
    if(p > 0.65){
      const eyeAlpha = Math.min(1, (p - 0.65) / 0.1);
      X.globalAlpha = eyeAlpha;
      X.fillStyle = COLORS.golemEye;
      X.fillRect(cx + 2, oy + P.respawnY + 3, 4, 3);
    }

    // Glyph lines (75-90%)
    if(p > 0.75){
      const glyphAlpha = Math.min(1, (p - 0.75) / 0.15);
      X.globalAlpha = glyphAlpha * (0.3 + Math.sin(now/500)*0.15);
      X.fillStyle = COLORS.golemEye;
      for(let i = 0; i < glyphsCollected; i++){
        X.fillRect(cx - pw/2 + 8, oy + P.respawnY + 12 + i*4, 8, 1);
      }
    }

    // Final activation flash (90-100%)
    if(flash > 0){
      X.globalAlpha = flash * 0.3;
      X.fillStyle = '#f0d060';
      X.beginPath();
      X.arc(cx, cy, (pw + ph) * flash * 0.8, 0, Math.PI*2);
      X.fill();
    }

    X.restore();
  }
}

function render(){
  const now=Date.now(); // B1: cache time once per frame
  const ch=P.chamber, c=chambers[ch];
  _c=c; // cache for fast getTile
  const glyphCollected=collectedGlyphs[ch]; // A8: cache lookup

  X.fillStyle=COLORS.bg; X.fillRect(0,0,W,H);

  /* Subtle starfield (B4: precomputed per chamber) */
  X.fillStyle='#1a1a2e';
  for(const [sx,sy] of c.stars) X.fillRect(sx,sy,1,1);

  /* Center chamber on screen */
  const ox=Math.floor((W-c.w*T)/2);
  const oy=Math.floor((H-c.h*T)/2);

  /* ── Tiles (sparse: only non-AIR) ── */
  for(const s of c.solidTiles){
    const x=s.x, y=s.y, t=c.tiles[y][x], px=ox+x*T, py=oy+y*T;

    if(t===WALL){
      X.fillStyle=COLORS.wall; X.fillRect(px,py,T,T);
      X.fillStyle=COLORS.wallTop; X.fillRect(px,py,T,3);
      X.fillStyle='#3a302a';
      if((x+y)%2===0) X.fillRect(px+T/2-1,py,2,T);
      X.fillRect(px,py+T/2-1,T,2);
      let adjPit=false;
      if(y+1<c.h && c.tiles[y+1]&&c.tiles[y+1][x]===PIT) adjPit=true;
      if(y-1>=0 && c.tiles[y-1]&&c.tiles[y-1][x]===PIT) adjPit=true;
      if(x-1>=0 && c.tiles[y]&&c.tiles[y][x-1]===PIT) adjPit=true;
      if(x+1<c.w && c.tiles[y]&&c.tiles[y][x+1]===PIT) adjPit=true;
      if(adjPit){
        X.fillStyle='rgba(180,40,20,0.25)';
        X.fillRect(px,py,T,T);
      }

    } else if(t===PLATFORM){
      X.fillStyle=COLORS.platform; X.fillRect(px+2,py+2,T-4,3);
      X.fillStyle='#6a5d4a'; X.fillRect(px+2,py+1,T-4,2);

    } else if(t===PIT){
      X.fillStyle=COLORS.pit; X.fillRect(px,py,T,T);
      const glow=Math.sin(now/600+x)*0.3+0.3;
      X.fillStyle='rgba(180,40,20,'+glow+')'; X.fillRect(px,py,T,2);
      X.fillStyle='rgba(100,20,10,'+glow*0.5+')'; X.fillRect(px,py,T,4);
      X.fillStyle='rgba(180,40,20,0.15)'; X.fillRect(px,py,2,T);
      X.fillRect(px+T-2,py,2,T);

    } else if(t===DOOR_D){
      const locked = !glyphCollected;
      if(locked){
        const pulse=Math.sin(now/500)*0.2+0.7;
        X.fillStyle='#1a1520'; X.fillRect(px,py,T,T);
        X.fillStyle='rgba(160,30,30,'+pulse+')'; X.fillRect(px+1,py+1,T-2,T-2);
        X.fillStyle='rgba(120,20,20,'+(pulse*0.6)+')'; X.fillRect(px+3,py+3,T-6,T-6);
        X.fillStyle='rgba(180,50,50,'+(pulse*0.5)+')'; X.fillRect(px+5,py+5,T-10,T-10);
        X.strokeStyle='#6a2020'; X.lineWidth=2; X.strokeRect(px+2,py+2,T-4,T-4);
        X.fillStyle='#8a3030'; X.font='16px serif';
        X.textAlign='center'; X.textBaseline='middle';
        X.fillText('\u{1F512}', px+T/2, py+T/2);
      } else {
        const pulse=Math.sin(now/500)*0.15+0.85;
        X.fillStyle='rgba(42,90,58,'+pulse+')'; X.fillRect(px,py,T,T);
        X.fillStyle='#3a7a4a'; X.fillRect(px+1,py+1,T-2,T-2);
        X.fillStyle='#5aaa6a'; X.fillRect(px+3,py+3,T-6,T-6);
        X.fillStyle='rgba(90,170,106,0.5)'; X.fillRect(px+5,py+5,T-10,T-10);
        X.fillStyle='#fff'; X.font='14px serif';
        X.textAlign='center'; X.textBaseline='middle';
        X.fillText('\u279C', px+T/2, py+T/2);
      }

    } else if(t===END_PORTAL){
      const pulse=Math.sin(now/400)*0.2+0.8;
      const pulse2=Math.sin(now/300)*0.3+0.5;
      X.fillStyle='rgba(20,10,40,'+pulse+')'; X.fillRect(px,py,T,T);
      X.fillStyle='rgba(180,140,60,'+pulse+')'; X.fillRect(px+1,py+1,T-2,T-2);
      X.fillStyle='rgba(240,200,100,'+pulse2+')'; X.fillRect(px+3,py+3,T-6,T-6);
      X.fillStyle='rgba(255,240,200,'+(pulse*0.6)+')'; X.fillRect(px+5,py+5,T-10,T-10);
      X.fillStyle='rgba(255,255,255,'+(pulse*0.4)+')'; X.fillRect(px+8,py+8,T-16,T-16);
      X.strokeStyle='rgba(240,200,100,'+pulse+')'; X.lineWidth=2; X.strokeRect(px+1,py+1,T-2,T-2);
      X.fillStyle='#fff'; X.font='14px serif';
      X.textAlign='center'; X.textBaseline='middle';
      X.fillText('\u2605', px+T/2, py+T/2);

    } else if(t===GLYPH){
      const bob=Math.sin(now/400)*3;
      const pulse=Math.sin(now/300)*0.3+0.7;
      X.fillStyle='rgba(200,168,78,'+(pulse*0.3)+')';
      X.beginPath(); X.arc(px+T/2,py+T/2+bob,T,0,Math.PI*2); X.fill();
      X.fillStyle=COLORS.glyphGlow;
      X.fillRect(px+12,py+4+bob,8,20); X.fillRect(px+8,py+10+bob,16,8);
      X.fillStyle=COLORS.glyph;
      X.fillRect(px+13,py+5+bob,6,16); X.fillRect(px+10,py+12+bob,12,4);

    } else if(t===CRACKED){
      X.fillStyle=COLORS.cracked; X.fillRect(px,py,T,T);
      X.fillStyle=COLORS.wallTop; X.fillRect(px,py,T,3);
      X.strokeStyle='#2a1010'; X.lineWidth=2;
      X.beginPath();
      X.moveTo(px+4,py+4); X.lineTo(px+T/2,py+T/2);
      X.lineTo(px+T-4,py+6);
      X.moveTo(px+T/2,py+T/2); X.lineTo(px+8,py+T-4);
      X.stroke();
      if(P.canBreak){ X.fillStyle='rgba(255,100,50,0.2)'; X.fillRect(px,py,T,T); }

    } else if(t===MAGICAL_WALL){
      const pulse=Math.sin(now/300+x*0.7+y*0.5)*0.3+0.5;
      const phaseAlpha = P.dashPhase ? 0.2 : 0.6;
      X.fillStyle='rgba(60,20,80,'+phaseAlpha+')'; X.fillRect(px,py,T,T);
      X.strokeStyle='rgba(180,80,255,'+(pulse*phaseAlpha)+')'; X.lineWidth=2;
      X.strokeRect(px+3,py+3,T-6,T-6);
      X.fillStyle='rgba(220,120,255,'+(pulse*phaseAlpha*0.7)+')';
      X.fillRect(px+10,py+6,12,20); X.fillRect(px+6,py+12,20,8);
      for(let i=0;i<3;i++){
        const sparkY=(now/200+i*11)%T;
        X.fillStyle='rgba(255,200,255,'+(pulse*0.5)+')';
        X.fillRect(px+8+i*7, sparkY, 2, 2);
      }
    }
  }

  /* ── Push block entity ── */
  if(PB.active){
    const bpx=ox+PB.x, bpy=oy+PB.y;
    X.fillStyle=PB.inSlot ? '#7a6a58' : COLORS.pushBlock;
    X.fillRect(bpx,bpy,PB.w,PB.h);
    X.fillStyle=PB.inSlot ? '#8a7a68' : COLORS.pushBlockTop;
    X.fillRect(bpx+1,bpy+1,PB.w-2,3);
    X.fillStyle='#6a5a4a';
    X.fillRect(bpx+1,bpy+PB.h-4,PB.w-2,3);
    /* Hint glow only when pushable (not in slot) */
    if(P.canPush && !PB.inSlot){
      const hintPulse=Math.sin(now/400)*0.2+0.3;
      X.fillStyle='rgba(212,168,75,'+hintPulse+')';
      X.fillRect(bpx+3,bpy+3,PB.w-6,PB.h-6);
    }
  }

  /* ── Particles (behind player) ── */
  for(const p of particles){
    const a=p.life/p.maxLife;
    X.fillStyle=p.color+(a>0.7?'':'');
    if(a<0.7) X.globalAlpha=a;
    X.fillRect(ox+p.x-p.size/2, oy+p.y-p.size/2, p.size, p.size);
    X.globalAlpha=1;
  }

  /* ── Dash charge indicator (behind player, does not obscure golem) ── */
  if(P.dashCharge > 0){
    const cx = ox + P.x + P.w / 2;
    const cy = oy + P.y + P.h / 2;
    const chargeRatio = P.dashCharge / DASH_CHARGE_MAX;
    const radius = DASH_CHARGE_RING_MIN + (DASH_CHARGE_RING_MAX - DASH_CHARGE_RING_MIN) * chargeRatio;

    X.save();
    X.lineWidth = 1.5;

    if(chargeRatio >= 1){
      /* Max charge — pulsating ring */
      const pulse = Math.sin(now / 150) * 0.5 + 0.5;
      const outerRadius = radius + 3 + pulse * 3;
      /* Outer pulse ring */
      X.strokeStyle = 'rgba(200,140,255,' + (0.15 + pulse * 0.25) + ')';
      X.lineWidth = 2;
      X.beginPath();
      X.arc(cx, cy, outerRadius, 0, Math.PI * 2);
      X.stroke();
      /* Inner steady ring — brighter at max */
      X.strokeStyle = 'rgba(200,140,255,' + (0.5 + pulse * 0.2) + ')';
      X.lineWidth = 2;
      X.beginPath();
      X.arc(cx, cy, radius, 0, Math.PI * 2);
      X.stroke();
    } else {
      /* Charging — ring grows proportionally */
      const alpha = 0.25 + chargeRatio * 0.35;
      X.strokeStyle = 'rgba(180,120,255,' + alpha + ')';
      X.lineWidth = 1.5;
      X.beginPath();
      X.arc(cx, cy, radius, 0, Math.PI * 2);
      X.stroke();
      /* Subtle fill to give a soft glow */
      X.fillStyle = 'rgba(160,100,240,' + (alpha * 0.12) + ')';
      X.beginPath();
      X.arc(cx, cy, radius, 0, Math.PI * 2);
      X.fill();
    }

    X.restore();
  }

/* ── Player (squash & stretch) ── */
  if(animState==='dying'||animState==='respawning'){
    renderDeathRespawnAnimation(ox, oy);
  } else {
  let pw=P.w, ph=P.h, poffX=0, poffY=0;
  const fallingFast = P.vy > 3;
  if(P.pushing){
    // Push animation: forward-leaning squash (narrower, slightly compressed)
    pw = P.w - 3;
    ph = P.h - 1;
    poffX = P.facing * 3;  // lean toward push direction
    poffY = 1;
  }
  else if(!P.onGround && P.vy<0){ pw=P.w-3; ph=P.h+4; poffY=-4; }
  else if(P.onGround && Math.abs(P.vx)>1){ pw=P.w+3; ph=P.h-2; poffY=2; }
  else if(fallingFast){ pw=P.w-2; ph=P.h+6; poffY=-2; }

  const px=ox+P.x+(P.w-pw)/2+poffX, py=oy+P.y+poffY;

  X.fillStyle=COLORS.golemDark; X.fillRect(px+4,py+6,pw-8,ph-10);
  X.fillStyle=COLORS.golem;
  X.fillRect(px+2,py+4,pw-4,ph-4);
  X.fillRect(px+4,py,pw-8,10);
  X.fillStyle=COLORS.golemEye;
  X.fillRect(P.facing>0?px+14:px+6, py+3, 4, 3);
  X.fillStyle=COLORS.golemDark;
  X.fillRect(px+3,py+ph-4,7,4); X.fillRect(px+pw-10,py+ph-4,7,4);
  X.fillStyle=COLORS.golem;
 X.fillRect(px-1,py+10,3,10); X.fillRect(px+pw-2,py+10,3,10);

  /* Push effort: arms press into block */
  if(P.pushing){
    const effortPulse = Math.sin(now/150)*0.15+0.3;
    X.fillStyle='rgba(212,168,75,'+effortPulse+')';
    // Arm/shoulder lines toward push direction
    const armX = P.facing > 0 ? px+pw-2 : px-3;
    X.fillRect(armX, py+8, 5, 3);
    X.fillRect(armX+(P.facing>0?2:-2), py+12, 5, 3);
  }

  /* Glyph lines on body */
  X.fillStyle='rgba(212,168,75,'+(0.3+Math.sin(now/500)*0.15)+')';
  for(let i=0;i<glyphsCollected;i++){
    X.fillRect(px+8, py+12+i*4, 8, 1);
  }

  /* Falling motion lines */
  if(fallingFast){
    X.fillStyle='rgba(200,168,78,0.4)';
    const drop = (now/100)%12;
    for(let i=0;i<3;i++){
      const ly = py + ph + 4 + drop + i*8;
      X.fillRect(px+4+i*7, ly, 2, 4);
    }
  }
  }

  /* ── HUD ── */
  X.fillStyle=COLORS.text; X.font='14px monospace'; X.textAlign='left';
  X.fillText('Glyphs: '+glyphsCollected+'/4', 10, 20);

  X.font='11px monospace';
  let ay=36;
  for(const [name,req] of ABILITIES){
    X.fillStyle=glyphsCollected>=req?'#8f8':'#444';
    X.fillText(name, 10, ay); ay+=14;
  }

  /* Dash charge indicator in HUD */
  if(P.dashCharge > 0){
    const chargeRatio = P.dashCharge / DASH_CHARGE_MAX;
    const barW = 80, barH = 4;
    const barX = 10, barY = ay + 4;
    X.fillStyle='rgba(100,60,160,0.5)';
    X.fillRect(barX, barY, barW, barH);
    X.fillStyle='rgba(200,140,255,' + (0.5 + chargeRatio * 0.5) + ')';
    X.fillRect(barX, barY, barW * chargeRatio, barH);
    if(chargeRatio >= 1){
      const pulse = Math.sin(now/150)*0.3+0.7;
      X.fillStyle='rgba(220,160,255,' + pulse + ')';
      X.font='9px monospace';
      X.fillText('MAX', barX + barW + 4, barY + 4);
    }
  }

 /* Chamber name + portal status */
  X.fillStyle='#665a4a'; X.font='12px monospace'; X.textAlign='center';
  if(c.flowId){
    const fi = CHAMBER_FLOW.indexOf(c.flowId);
    if(fi >= 0 && fi < CHAMBER_FLOW.length - 1){
      /* Main chambers with portal (not last in flow) */
      const locked = !glyphCollected;
      const portalStatus = locked ? ' \u{1F512} Portal Sealed' : ' Portal Open \u2714';
      X.fillText(CHAMBER_NAMES[fi] + portalStatus, W/2, H-10);
    } else if(fi === CHAMBER_FLOW.length - 1){
      /* Last chamber in flow — The Ibis Chamber */
      X.fillText(CHAMBER_NAMES[fi] + ' \u2605 Path of Wisdom', W/2, H-10);
    }
  } else {
    /* Test chamber (no flowId) */
    X.fillText('Ch.T Test Chamber', W/2, H-10);
  }

 /* Message */
  if(messageQueue.length>0){
    const m=messageQueue[0];
    let alpha=1;
    if(m.phase==='fadeIn')alpha=m.elapsed/MSG_FADE_IN_FRAMES;
    else if(m.phase==='fadeOut')alpha=1-(m.elapsed/MSG_FADE_OUT_FRAMES);
    X.fillStyle='rgba(212,168,75,'+alpha+')';
    X.font='bold 18px serif'; X.textAlign='center';
    X.shadowColor='rgba(0,0,0,0.7)'; X.shadowBlur=4;
    X.fillText(m.text, W/2, H/2-60);
    X.shadowBlur=0;
  }

  /* Screen fade overlay */
  if(screenAlpha>0){
    X.fillStyle='rgba(0,0,0,'+screenAlpha+')';
    X.fillRect(0,0,W,H);
  }

  /* ── Ending screen ── */
  if(gameState==='ending'){
    X.fillStyle='rgba(0,0,0,0.92)'; X.fillRect(0,0,W,H);
    X.fillStyle=COLORS.text; X.font='bold 28px serif'; X.textAlign='center';
    X.fillText('Awakening of the Golem', W/2, H/2-50);
    X.strokeStyle=COLORS.text; X.lineWidth=1;
    X.beginPath(); X.moveTo(W/2-100,H/2-35); X.lineTo(W/2+100,H/2-35); X.stroke();
    X.font='italic 20px serif';
    X.fillText("The Ibis speaks:", W/2, H/2-5);
    X.font='italic 22px serif';
    X.fillText("'You were clay. Now you are Wisdom.'", W/2, H/2+25);
    X.fillStyle='#555'; X.font='14px monospace';
    X.fillText('Refresh to play again', W/2, H/2+70);
  }

  if(ch===0 && glyphsCollected===0 && messageQueue.length===0){
    X.fillStyle='#665a4a'; X.font='14px serif'; X.textAlign='center';
    X.fillText('I awaken...', W/2, 60);
  }
}

/* ══════════════════════════════════════════════════
   11. INIT & GAME LOOP
   ══════════════════════════════════════════════════ */

/* ── Init ── */
collectedGlyphs = new Array(chambers.length).fill(false);

/* B4: Precompute starfield per chamber */
chambers.forEach((c, i) => {
  c.stars = [];
  for(let j=0; j<40; j++)
    c.stars.push([(j*137+i*50)%W, (j*97+i*30)%H]);
});

/* B5: Build sparse render list — only non-AIR tiles need drawing */
chambers.forEach(c => {
  c.solidTiles = [];
  for(let y=0; y<c.h; y++)
    for(let x=0; x<c.w; x++){
      if(c.tiles[y][x] !== AIR) c.solidTiles.push({x, y});
      if(c.tiles[y][x] === GOLEM_SPAWN){ c.spawnPx = x*T; c.spawnPy = y*T; }
    }
});

P.x=chambers[0].spawnPx; P.y=chambers[0].spawnPy;
P.respawnX=chambers[0].spawnPx; P.respawnY=chambers[0].spawnPy;
P.coyoteTime=0; P.onGround=false;
animState='respawning'; animFrame=0;
showMessage('I awaken...', 150);

/* ── Game loop ── */
function loop(){ update(); render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

</script>
</body>
