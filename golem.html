<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Golem Awakens</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0A0A12; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
#game-wrapper { display: flex; flex-direction: column; align-items: center; transform-origin: center center; }
#hud-bar { width: 800px; height: 32px; background: rgba(10,10,18,0.85); border: 1px solid rgba(197,179,145,0.2); border-bottom: 1px solid rgba(197,179,145,0.15); display: flex; justify-content: space-between; align-items: center; padding: 0 12px; font: 11px system-ui,-apple-system,"Segoe UI",sans-serif; color: #E8E8F0; user-select: none; }
#hud-bar .hud-left, #hud-bar .hud-right { display: flex; align-items: center; gap: 12px; }
#hud-bar .hud-left { direction: rtl; }
canvas { display: block; image-rendering: pixelated; }
#game-shell { position: relative; width: 800px; height: 480px; }
#title-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; cursor: pointer; }
#title-screen .ts-bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, rgba(26,26,48,1) 0%, rgba(10,10,18,1) 70%); }
#title-screen .ts-content { position: relative; z-index: 2; text-align: center; display: flex; flex-direction: column; align-items: center; }
#title-screen .ts-logo { margin-bottom: 16px; }
#title-screen .ts-logo svg { width: 420px; height: auto; }
#title-screen .ts-title { font-family: Georgia,'Times New Roman',serif; font-size: 38px; color: #C5B391; letter-spacing: 6px; text-shadow: 0 0 20px rgba(197,179,145,0.4), 0 0 40px rgba(197,179,145,0.15), 0 2px 4px rgba(0,0,0,0.7); margin-bottom: 40px; }
#title-screen .ts-credits { font-family: Georgia,'Times New Roman',serif; font-size: 14px; color: #6B6B80; margin-bottom: 48px; }
#title-screen .ts-credits a { color: #C5B391; text-decoration: none; }
#title-screen .ts-credits a:hover { color: #5CB3AF; }
#title-screen .ts-credits svg { vertical-align: middle; margin-left: 4px; }
#title-screen .ts-blurb { font-family: Georgia,'Times New Roman',serif; font-size: 13px; color: #4A4A5C; margin-bottom: 16px; }
#title-screen .ts-blurb a { color: #6B6B80; text-decoration: none; }
#title-screen .ts-blurb a:hover { color: #5CB3AF; }
#title-screen .ts-start { font-family: Georgia,'Times New Roman',serif; font-size: 16px; color: rgba(232,232,240,0.6); letter-spacing: 3px; animation: tsPulse 2.5s ease-in-out infinite; }
@keyframes tsPulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
#pause-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 5; cursor: default; }
#pause-overlay .po-bg { position: absolute; inset: 0; background: rgba(10,10,18,0.88); z-index: -1; }
#pause-overlay .po-title { font-family: Georgia,'Times New Roman',serif; font-size: 32px; color: #C5B391; letter-spacing: 8px; text-shadow: 0 0 15px rgba(197,179,145,0.3); margin-bottom: 36px; }
#pause-overlay button { font-family: Georgia,'Times New Roman',serif; font-size: 16px; color: #C5B391; background: none; border: 1px solid rgba(197,179,145,0.35); padding: 8px 24px; margin: 6px 0; cursor: pointer; letter-spacing: 2px; transition: background 0.2s, color 0.2s; width: 240px; }
#pause-overlay button:hover { background: rgba(197,179,145,0.1); color: #5CB3AF; border-color: rgba(92,179,175,0.4); }
#pause-overlay .po-controls { margin: 0 auto 20px auto; padding: 12px 24px; border: 1px solid rgba(197,179,145,0.2); border-radius: 4px; background: rgba(10,10,18,0.5); }
#pause-overlay .po-controls-title { font-family: Georgia,'Times New Roman',serif; font-size: 13px; color: #A18F75; letter-spacing: 4px; text-align: center; margin-bottom: 8px; }
#pause-overlay .po-control-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; }
#pause-overlay .po-key { font-family: Georgia,'Times New Roman',serif; font-size: 13px; color: #C5B391; letter-spacing: 1px; min-width: 0; flex: 1; }
#pause-overlay .po-action { font-family: Georgia,'Times New Roman',serif; font-size: 13px; color: #6B6B80; letter-spacing: 1px; margin-left: 16px; }
</style>
</head>

<script>

/* ══════════════════════════════════════════════════
   1. SETUP & CONSTANTS
   ══════════════════════════════════════════════════ */

const C = document.getElementById('c');
const X = C.getContext('2d');
const W = 800, H = 480, T = 32;
C.width = W; C.height = H;

/* ── Tile types ── */
const AIR=0, WALL=1, PIT=2, GOLEM_SPAWN=3, DOOR_D=4, GLYPH=5, CRACKED=7, PLATFORM=8, END_PORTAL=9, MAGICAL_WALL=10, PUSH_SPAWN=11;

/* ── Dash constants ── */
const DASH_CHARGE_MAX = 180;       // frames (3 seconds at 60fps)
const DASH_DISTANCE_MIN = 60;      // px — minimum dash distance
const DASH_DISTANCE_MAX = 267;     // px — ~1/3 of 800px chamber
const DASH_DURATION = 10;          // frames — how long dash executes
const DASH_COOLDOWN = 20;          // frames after dash before next charge
const DASH_CHARGE_RING_MIN = 8;    // px — minimum indicator radius
const DASH_CHARGE_RING_MAX = 40;   // px — maximum indicator radius
const PUSH_SPEED = 1.25;           // px/frame — half of walk speed 2.5

/* ── Particle color constants (extracted from call sites) ── */
const DASH_EXEC_PARTICLE_COLOR = 'rgba(92,179,175,0.50)';
const DASH_CHARGE_PARTICLE_COLOR = 'rgba(71,158,153,0.35)';

/* ── Player physics constants ── */
const H_ACCEL_GROUND = 0.05;    // horizontal acceleration on ground
const H_ACCEL_AIR = 0.2;        // horizontal acceleration in air
const H_FRICTION = 0.225;       // horizontal deceleration
const GRAVITY = 0.07;           // gravity per frame
const TERMINAL_VEL = 2.5;       // terminal velocity (both X and Y)
const JUMP_VEL_1 = -5;          // first jump velocity
const JUMP_VEL_2 = -4.33;       // double jump velocity
const JUMP_CUT_VEL = -2;        // variable jump cut velocity (release to short-hop)
const COYOTE_FRAMES = 12;       // coyote time in frames (200ms at 240Hz)
const JUMP_BUFFER_FRAMES = 12;  // jump buffer in frames (200ms at 240Hz)
const CHARGE_FRICTION = 0.85;   // dash charge state friction

/* ── Simulation timing ── */
const SIM_HZ_DEFAULT    = 240;        // Hard: 240 Hz (preserves tuned constants)
const SIM_HZ_EASY       = 144;        // Easy: 144 Hz (slower, more forgiving)
let simHz               = SIM_HZ_DEFAULT;
let simDt               = 1000 / simHz; // ms per tick
let simAcc              = 0;           // accumulator in ms
let lastSimTime         = 0;          // last performance.now() for accumulator

/* ── Derived frame-count constants (scaled by SIM_HZ, computed in applyPaceAssists) ── */
let COYOTE_FRAMES_ACTUAL  = 12;
let JUMP_BUFFER_ACTUAL    = 12;
let DASH_CHARGE_MAX_ACTUAL = 180;
let DASH_DURATION_ACTUAL  = 10;
let DASH_COOLDOWN_ACTUAL  = 20;
let ANIM_TOTAL_ACTUAL     = 90;
let MSG_FADE_IN_ACTUAL    = 180;
let MSG_FADE_OUT_ACTUAL   = 180;
let MSG_MIN_HOLD_ACTUAL   = 90;
let MSG_MAX_HOLD_ACTUAL   = 360;

function applyPaceAssists(){
  const r = simHz / SIM_HZ_DEFAULT;
  COYOTE_FRAMES_ACTUAL   = Math.ceil(12 * r);
  JUMP_BUFFER_ACTUAL     = Math.ceil(12 * r);
  DASH_CHARGE_MAX_ACTUAL = Math.ceil(180 * r);
  DASH_DURATION_ACTUAL   = Math.ceil(10 * r);
  DASH_COOLDOWN_ACTUAL   = Math.ceil(20 * r);
  ANIM_TOTAL_ACTUAL      = Math.ceil(90 * r);
  MSG_FADE_IN_ACTUAL     = Math.ceil(180 * r);
  MSG_FADE_OUT_ACTUAL    = Math.ceil(180 * r);
  MSG_MIN_HOLD_ACTUAL    = Math.ceil(90 * r);
  MSG_MAX_HOLD_ACTUAL    = Math.ceil(360 * r);
}
applyPaceAssists();

/* ── Pace (difficulty) persistence ── */
let paceMode = 'hard';

function loadPace(){
  const saved = localStorage.getItem('golem_pace');
  if(saved === 'easy' || saved === 'hard') paceMode = saved;
  else paceMode = 'easy';
  applyPace();
}

function applyPace(){
  simHz = paceMode === 'easy' ? SIM_HZ_EASY : SIM_HZ_DEFAULT;
  simDt = 1000 / simHz;
  applyPaceAssists();
}

function togglePace(){
  paceMode = paceMode === 'easy' ? 'hard' : 'easy';
  localStorage.setItem('golem_pace', paceMode);
  applyPace();
}

/* ── Push block physics constants ── */
const PB_GRAVITY = 0.3;         // push block gravity
const PB_TERMINAL_VEL = 4;      // push block terminal velocity
const PB_FRICTION = 0.85;       // push block friction
const PB_STOP_THRESH = 0.1;     // push block velocity threshold to stop

/* ── Particle color constants ── */
const PARTICLE_COLORS = {
  jump: '#A89B8E',
  doubleJump: '#C5B391',
  glyph: '#C5B391',
  dashBurst: 'rgba(92,179,175,0.6)',
  death: '#A89B8E',
};

/* ── Font constants ── */
const FONT_UI      = '11px system-ui, -apple-system, "Segoe UI", sans-serif';
const FONT_DISPLAY = 'italic 16px Georgia, "Times New Roman", serif';

/* Snap player X to tile boundary after collision */
function snapToTileX(gx1, gx2, prevX) {
  if(P.vx>0){ P.x=gx2*T-P.w; }
  else if(P.vx<0){ P.x=(gx1+1)*T; }
  else { P.x=prevX; }
}

/* Get player center as grid coordinates */
function playerGridPos() {
  return { gx: Math.floor((P.x+P.w/2)/T), gy: Math.floor((P.y+P.h/2)/T) };
}

/* End dash state cleanly */
function endDash() {
  P.dashing=false; P.dashTimer=0; P.dashCooldown=DASH_COOLDOWN_ACTUAL; P.dashPhase=false; P._dashSfx=false;
}

/* Land on ground — reset jumps and coyote */
function land() {
  P.onGround=true; P.jumps=0; P.coyoteTime=COYOTE_FRAMES_ACTUAL;
}

/* ── Easing functions for animations ── */
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeOutQuint(t) { return 1 - Math.pow(1 - t, 5); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smoothStep(t) { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); }

/* ── Sync prevKeys with current keys (spread, no unbounded growth) ── */
function syncPrevKeys() { prevKeys = { ...keys }; }

/* ── Advance message queue phases and decrement portal lock timer ── */
function advanceTimers() {
  if(messageQueue.length>0){
    const m=messageQueue[0];
    m.elapsed++;
   if(m.phase==='fadeIn' && m.elapsed>=MSG_FADE_IN_ACTUAL){
      m.phase='display'; m.elapsed=0;
    } else if(m.phase==='display' && m.elapsed>=m.hold){
      m.phase='fadeOut'; m.elapsed=0;
    } else if(m.phase==='fadeOut' && m.elapsed>=MSG_FADE_OUT_ACTUAL){
      messageQueue.shift();
    }
  }
  if(portalLockMsg>0) portalLockMsg--;
}

/* Reset all dash state — used on death/transition to fully clear */
function fullDashReset() {
  P.dashing=false; P.dashTimer=0; P.dashCooldown=0; P.dashPhase=false; P.dashCharge=0;
}

/* Cancel an active dash without resetting cooldown — used on immediate death */
function cancelDash() {
  P.dashing=false; P.dashTimer=0;
}

/* Caption fade timing helper for ending sequence */
function captionAlpha(f, start, fadeIn, hold, fadeOut) {
  if (f < start) return 0;
  let t = f - start;
  if (fadeIn > 0 && t < fadeIn) return t / fadeIn;
  t -= fadeIn;
  if (hold > 0 && t < hold) return 1;
  t -= hold;
  if (fadeOut > 0 && t < fadeOut) return 1 - (t / fadeOut);
  if (fadeOut === 0) return 1;
  return 0;
}

/* Caption fade timing (wall-clock seconds) — for ending sequence */
function captionAlphaSec(t, start, fadeIn, hold, fadeOut) {
  if (t < start) return 0;
  let elapsed = t - start;
  if (fadeIn > 0 && elapsed < fadeIn) return elapsed / fadeIn;
  elapsed -= fadeIn;
  if (hold > 0 && elapsed < hold) return 1;
  elapsed -= hold;
  if (fadeOut > 0 && elapsed < fadeOut) return 1 - (elapsed / fadeOut);
  if (fadeOut === 0) return 1;
  return 0;
}

/* Restore player position and velocity to respawn point */
function resetPlayerToRespawn() {
  P.x=P.respawnX; P.y=P.respawnY; P.vx=0; P.vy=0; P.jumps=0; P.dashCharge=0;
}

/* Kill and respawn player at checkpoint */
function killAndRespawn(msg, duration) {
  if(animState!=='idle') return; // prevent double-trigger
  cancelDash();
 animState='dying'; animFrame=0;
  Sound.play('death');
  Sound.duckMusic(1.5);
  totalDeaths++;
  showMessage(msg, duration);
}

let keys = {};
let prevKeys = {};

document.addEventListener('keydown', function(e){
  keys[e.code] = true;

  /* Title screen: any key starts the game */
  if(gameState==='title'){
    startGame();
    e.preventDefault();
    return;
  }

 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyW','KeyA','KeyS','KeyD','ShiftLeft','ShiftRight','KeyP','KeyM'].includes(e.code))
    e.preventDefault();

  /* Mute toggle */
  if(fresh('KeyM')) Sound.setMute(!Sound.isMuted());
});
document.addEventListener('keyup', function(e){ keys[e.code] = false; });

function fresh(code){ return keys[code] && !prevKeys[code]; }

function shiftHeld(){ return keys['ShiftLeft']||keys['ShiftRight']; }

/* Input normalization abstractions */
function inputLeft()         { return keys['ArrowLeft']  || keys['KeyA']; }
function inputRight()        { return keys['ArrowRight'] || keys['KeyD']; }
function inputJumpPressed()  { return fresh('ArrowUp')||fresh('KeyW')||fresh('Space'); }
function inputJumpHeld()     { return keys['ArrowUp'] || keys['KeyW'] || keys['Space']; }
function inputShiftPressed() { return fresh('ShiftLeft')||fresh('ShiftRight'); }
function inputDown()         { return keys['ArrowDown']  || keys['KeyS']; }

function getTile(ch,x,y){
  const c=chambers[ch];
  if(x<0||x>=c.w||y<0||y>=c.h) return WALL;
  return c.tiles[y][x];
}
function setTile(ch,x,y,v){
  const c=chambers[ch];
  if(x>=0&&x<c.w&&y>=0&&y<c.h){ c.tiles[y][x]=v; }
}

/* Fast tile access — uses pre-cached _c (set at update/render entry) */
function _getTile(x,y){
  if(x<0||x>=_c.w||y<0||y>=_c.h) return WALL;
  return _c.tiles[y][x];
}

/* Solid for walls/blocks/doors/end-portal (not one-way platforms) */
function solid(t){ return t===WALL||t===CRACKED||t===DOOR_D||t===END_PORTAL||t===MAGICAL_WALL; }

/* Platform is solid ONLY when player feet were at/above platform top (true one-way).
   prevFeet = previous feet bottom (prevY+P.h). gy = platform tile row. */
function platSolid(t, prevFeet, gy){
  if(t!==PLATFORM) return false;
  if(inputDown()) return false;
  return prevFeet <= gy * T + 2;
}

/* Unified tile collision checker — grid-space iteration with configurable options.
   Options: {skipTileType: tileValue, includePlatforms: bool, prevY: px, curY: px} */
function tileCollidesRect(ch, gx1, gy1, gx2, gy2, opts) {
  for(let gy=gy1;gy<=gy2;gy++)
    for(let gx=gx1;gx<=gx2;gx++){
      const t=getTile(ch,gx,gy);
      if(opts.skipTileType && t===opts.skipTileType) continue;
      if(solid(t)) return true;
      if(opts.includePlatforms && platSolid(t, opts.prevY + P.h, gy)) return true;
    }
  return false;
}

/* collides: for Y movement — check solid tiles + platforms at the NEW position */
function collides(gx1,gy1,gx2,gy2,ch,prevY,curY) {
  return tileCollidesRect(ch, gx1, gy1, gx2, gy2, {includePlatforms:true, prevY, curY});
}

/* collidesNoPlat: for X movement — solid tiles only, no platforms */
function collidesNoPlat(gx1,gy1,gx2,gy2,ch) {
  return tileCollidesRect(ch, gx1, gy1, gx2, gy2, {});
}

/* collidesDash: skips MAGICAL_WALL + checks push-block AABB */
function collidesDash(gx1,gy1,gx2,gy2,ch,prevY,curY) {
  if(tileCollidesRect(ch, gx1, gy1, gx2, gy2, {skipTileType:MAGICAL_WALL, includePlatforms:true, prevY, curY})) return true;
  /* Push block during dash */
  const x1=gx1*T, x2=(gx2+1)*T;
  for(const pb of PBlocks){
    if(pb.active && aabb(x1, prevY, x2-x1, P.h, pb.x, pb.y, pb.w, pb.h)) return true;
  }
  return false;
}

function inPit(){
  const px=P.x+P.w/2, py=P.y+P.h/2;
  const {gx, gy} = playerGridPos();
  const thresh=1.1*T;
  for(let dy=-1;dy<=1;dy++)
    for(let dx=-1;dx<=1;dx++){
      if(_getTile(gx+dx,gy+dy)!==PIT) continue;
      const tpx=(gx+dx+0.5)*T, tpy=(gy+dy+0.5)*T;
      const dist=Math.abs(px-tpx)+Math.abs(py-tpy);
      if(dist<thresh) return true;
    }
  return false;
}

/* AABB overlap test */
function aabb(ax,ay,aw,ah, bx,by,bw,bh){
  return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
}

/* Find overlapping push block (exclude self). inSlot blocks stay solid. */
function pushBlockHit(x, y, w, h, skip){
  for(const ob of PBlocks){
    if(ob === skip || !ob.active) continue;
    if(aabb(x, y, w, h, ob.x, ob.y, ob.w, ob.h)) return ob;
  }
  return null;
}

function isRiding(ob, base){
  const feet = ob.y + ob.h;
  return Math.abs(feet - base.y) <= 2 &&
         ob.x + ob.w > base.x + 2 && ob.x < base.x + base.w - 2;
}
/* Apply horizontal delta with tile + block collision. Does not touch vx. */
function resolveBlockX(ch, pb, dx){
  if(!dx) return 0;
  const prevX = pb.x;
  pb.x += dx;
  if(tileCollides(ch, pb.x, pb.y, pb.w, pb.h)){
    if(dx > 0) pb.x = Math.floor((pb.x + pb.w) / T) * T - pb.w;
    else       pb.x = (Math.floor(pb.x / T) + 1) * T;
  }
  const hitX = pushBlockHit(pb.x, pb.y, pb.w, pb.h, pb);
  if(hitX){
    if(dx > 0) pb.x = hitX.x - pb.w;
    else if(dx < 0) pb.x = hitX.x + hitX.w;
  }
  return pb.x - prevX;
}
/* Phase B: each rider attempts the same dx, with its own wall collision. */
function moveBlockRiders(ch, pb, dx){
  if(!dx) return;
  for(const ob of PBlocks){
    if(ob === pb || !ob.active || ob.inSlot) continue;
    if(!isRiding(ob, pb)) continue;
    resolveBlockX(ch, ob, dx);
    moveBlockRiders(ch, ob, dx);
  }
}
/* Phase A: apply vx as a horizontal move. Returns net displacement. */
function applyBlockVelocityX(ch, pb){
  if(!pb.vx){ pb._frameDx = 0; return; }
  const dx = pb.vx;
  const moved = resolveBlockX(ch, pb, dx);
  pb._frameDx = moved;
  if(moved !== dx) pb.vx = 0;
}
/* Phase C: gravity + tile/block Y resolution. */
function resolveBlockY(ch, pb){
  const prevBy = pb.y;
  pb.vy += PB_GRAVITY;
  if(pb.vy > PB_TERMINAL_VEL) pb.vy = PB_TERMINAL_VEL;
  pb.y += pb.vy;
  if(tileCollides(ch, pb.x, pb.y, pb.w, pb.h)){
    if(pb.vy > 0) pb.y = Math.floor((pb.y + pb.h) / T) * T - pb.h;
    else          pb.y = (Math.floor(pb.y / T) + 1) * T;
    pb.vy = 0;
  }
  const hitY = pushBlockHit(pb.x, pb.y, pb.w, pb.h, pb);
  if(hitY){
    const prevBottom = prevBy + pb.h;
    if(pb.vy > 0 && prevBottom <= hitY.y + 2){
      pb.y = hitY.y - pb.h;
      pb.vy = 0;
    } else if(pb.vy < 0){
      pb.y = hitY.y + hitY.h;
      pb.vy = 0;
    }
  }
}
/* Active blocks, bottom-up (larger y first). */
function activePushBlocks(){
  return PBlocks
    .filter(pb => pb.active && !pb.inSlot)
    .sort((a, b) => b.y - a.y);
}
/* Falling block crushes golem — only if block is above and actually landing on it. */
function checkPushBlockCrush(){
  if(animState !== 'idle') return;
  for(const pb of PBlocks){
    if(!pb.active || pb.inSlot) continue;
    if(pb.vy <= 0) continue;
    if(!aabb(P.x, P.y, P.w, P.h, pb.x, pb.y, pb.w, pb.h)) continue;
    /* Golem on top of / landing on block */
    if(P.y + P.h <= pb.y + 4) continue;
    if(pb.y >= P.y + P.h - 4) continue;
    /* Side brush — not enough horizontal overlap to count as "on" the golem */
    const overlapW = Math.min(P.x + P.w, pb.x + pb.w) - Math.max(P.x, pb.x);
    if(overlapW < 10) continue;
    killAndRespawn("Unformed clay breaks.", 90);
    return;
  }
}

/* Check if AABB overlaps any solid tile */
function tileCollides(ch, x, y, w, h){
  const x1=Math.floor(x/T), x2=Math.floor((x+w-1)/T);
  const y1=Math.floor(y/T), y2=Math.floor((y+h-1)/T);
  for(let gy=y1;gy<=y2;gy++)
    for(let gx=x1;gx<=x2;gx++)
      if(solid(getTile(ch,gx,gy))) return true;
  return false;
}

/* ══════════════════════════════════════════════════
   6. PUSH BLOCK SYSTEM
   ══════════════════════════════════════════════════ */

function resetPushBlock(){
  const c=chambers[P.chamber];
  PBlocks.length=0;
  if(!c) return;
  const spawns=c.pushSpawns||(c.pushSpawn?[c.pushSpawn]:null);
  if(!spawns) return;
  for(const sp of spawns){
    PBlocks.push({x:sp.x*T,y:sp.y*T,w:T,h:T,vx:0,vy:0,active:true,inSlot:false,_snd:false});
  }
}

/* Push block: resolve AFTER normal X movement + tile collision.
   Detect push overlap and apply velocity-based movement (not instant teleport). */
function resolvePushBlockCollision(){
  for(const pb of PBlocks){
    if(!pb.active || pb.inSlot) continue;
    if(!aabb(P.x, P.y, P.w, P.h, pb.x, pb.y, pb.w, pb.h)) continue;

    const centerP = P.x + P.w / 2;
    const centerB = pb.x + pb.w / 2;
    const dir = (centerP < centerB) ? 1 : -1;

    const movingToward = (P.vx * dir > 0.1);

    // Y-overlap guard: skip X separation when player is landing on top
    const isOnTop = P.y < pb.y
                   && P.y + P.h >= pb.y - 8
                   && P.y + P.h <= pb.y + P.h / 2;

    if(P.canPush && P.onGround && movingToward){
      // ── Active push: velocity-based ──
     P.pushing = true;
      P._pushF++;
      if(P._pushF % 2 === 0){ Sound.play('push'); }

      // Apply push velocity
      pb.vx = dir * PUSH_SPEED;

      // Clamp golem to same push speed (don't zero, just limit)
      if(Math.abs(P.vx) > PUSH_SPEED) P.vx = dir * PUSH_SPEED;

      // Keep golem glued to block side (smooth, no snap)
      if(dir > 0) P.x = Math.min(P.x, pb.x - P.w + 1);
      else        P.x = Math.max(P.x, pb.x + pb.w - 1);

    } else if(P.canPush && movingToward && !P.onGround){
      // Requirement 5: no push while airborne — separate
      if(dir > 0) P.x = pb.x - P.w;
      else        P.x = pb.x + pb.w;

    } else {
      // Not pushing — static separation (walking past, standing against)
      if(isOnTop) continue; // let Y landing check handle this (check other blocks too)
      if(centerP < centerB) P.x = pb.x - P.w;
      else                  P.x = pb.x + pb.w;
    }
  }
}

/* Push block: 3-phase orchestrator (crush check moved after player Y + landing) */
function updatePushBlock(){
  const ch = P.chamber;
  const c = chambers[ch];
  if(!c) return;
  const blocks = activePushBlocks();
  /* Phase A: horizontal velocity (each block, bottom-up) */
  for(const pb of blocks){
    applyBlockVelocityX(ch, pb);
  }
  /* Phase B: rider coupling (same dx, per-block wall collision) */
  for(const pb of blocks){
    if(pb._frameDx) moveBlockRiders(ch, pb, pb._frameDx);
  }
  /* Phase C: gravity + vertical resolution (bottom-up) */
  for(const pb of blocks){
    resolveBlockY(ch, pb);
  }
  /* Phase D: friction, fall reset */
  for(const pb of blocks){
    if(!P.pushing){
      pb.vx *= PB_FRICTION;
      if(Math.abs(pb.vx) < PB_STOP_THRESH) pb.vx = 0;
    }
    if(pb.y > c.h * T){
      const firstSpawn = c.pushSpawns ? c.pushSpawns[0] : c.pushSpawn;
      pb.x = firstSpawn.x * T;
      pb.y = firstSpawn.y * T;
      pb.vx = 0; pb.vy = 0;
      pb.inSlot = false;
    }
    pb._frameDx = 0;
  }
}

/* ══════════════════════════════════════════════════
   7. PARTICLE SYSTEM (IIFE — encapsulated module)
   ══════════════════════════════════════════════════ */

const Particles = (function(){
  /* Reference the global particles array — same array, encapsulated API */
  const pool = particles;

  function shatter(x,y){
    /* Chunky debris — fast, heavy */
    for(let i=0;i<12;i++)
      pool.push({x,y,
        vx:(Math.random()-0.5)*8, vy:-Math.random()*5-2,
        life:25+Math.random()*20, maxLife:45,
        color:['#42425C','#3A3A52','#5A5A72','#6A6A82'][i%4],
        size:3+Math.random()*4});
    /* Dust cloud — slow, diffuse */
    for(let i=0;i<10;i++)
      pool.push({x,y,
        vx:(Math.random()-0.5)*3, vy:-Math.random()*2,
        life:15+Math.random()*10, maxLife:25,
        color:'rgba(197,179,145,0.4)',
        size:2+Math.random()*2});
    /* Spark flash */
    for(let i=0;i<6;i++)
      pool.push({x,y,
        vx:(Math.random()-0.5)*6, vy:(Math.random()-0.5)*6,
        life:8+Math.random()*6, maxLife:14,
        color:'#C5B391',
        size:1+Math.random()*2});
  }

 function spawn(x,y,color,count,shape){
    for(let i=0;i<count;i++)
      pool.push({
        x, y,
        vx:(Math.random()-0.5)*4,
        vy:-Math.random()*3-1,
        life:20+Math.random()*15,
        maxLife:35,
        color,
        size:2+Math.random()*3,
        shape: shape || 'square'
      });
  }

  function update(){
    for(let i=pool.length-1;i>=0;i--){
      const p=pool[i];
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.1; p.life--;
      if(p.life<=0) pool.splice(i,1);
    }
  }

  return { spawn, shatter, update };
})();

const SFX = {

  death:        { t:'chord',    fs:[110,165,220], dur:1.15, g:0.05, wt:'triangle', fall:0.6, crack:0.07 },
};

const MUSIC_NOTES = [
  { f: 146.83, w: 'sine' },      // D3
  { f: 220.00, w: 'sine' },      // A3
  { f: 293.66, w: 'triangle' },  // D4
  { f: 349.23, w: 'sine' },      // F4
  { f: 440.00, w: 'sine' },      // A4
  { f: 349.23, w: 'sine' },      // F4
  { f: 293.66, w: 'triangle' },  // D4
  { f: 261.63, w: 'sine' },      // C4 (tension)
  { f: 220.00, w: 'sine' },      // A3
  { f: 293.66, w: 'triangle' },  // D4
  { f: 220.00, w: 'sine' },      // A3 (pickup)
  { f: 146.83, w: 'sine' },      // D3 (resolve)
];

const Sound = (function(){
  let ctx, mg, muted=false, drone, dGain, mTimer, mNext=0, mTime=0, nBuf, musicDuck=0;
  const BPM=75, BEAT=60/BPM/2, AHEAD=0.1, TICK=25;

  function init(){
    if(ctx) return;
    ctx = new (window.AudioContext||window.webkitAudioContext)();
    mg = ctx.createGain(); mg.gain.value=1; mg.connect(ctx.destination);
    mTime = ctx.currentTime;
    nBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
  }

  function setMute(v){
    muted=!!v;
    if(mg) mg.gain.value = muted?0:1;
  }

  function isMuted(){ return muted; }

  function play(n){
    if(!ctx||muted) return;
    if(ctx.state==='suspended') ctx.resume();
    const s=SFX[n]; if(!s) return;
    const now=ctx.currentTime;
    const gn=ctx.createGain();
    gn.gain.setValueAtTime(s.g||0.1, now);
    gn.gain.exponentialRampToValueAtTime(0.001, now+(s.dur||0.1));
    gn.connect(mg);

    if(s.crack){
      var gn2=ctx.createGain(); gn2.gain.setValueAtTime(s.crack,now);
      gn2.gain.exponentialRampToValueAtTime(0.001,now+0.08); gn2.connect(mg);
      var d2=nBuf.getChannelData(0); for(var j=0;j<ctx.sampleRate*0.08;j++) d2[j]=Math.random()*2-1;
      var src2=ctx.createBufferSource(); src2.buffer=nBuf;
      var bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1200; bp.Q.value=4;
      src2.connect(bp); bp.connect(gn2); src2.start(0,0,0.08);
    }

    if(s.t==='chord'){
      (s.fs||[]).forEach(function(f){
        var o=ctx.createOscillator(); o.type=s.wt||'sine'; o.frequency.value=f;
        if(s.fall) o.frequency.exponentialRampToValueAtTime(f*s.fall, now+(s.dur||0.25));
        o.connect(gn); o.start(now); o.stop(now+(s.dur||0.25));
      });
    } else if(s.t==='noise'){
      var len=Math.floor(ctx.sampleRate*Math.max(s.dur||0.2,0.01));
      var d=nBuf.getChannelData(0);
      for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
      var src=ctx.createBufferSource(); src.buffer=nBuf; src.playbackRate.value=1;
      var flt=ctx.createBiquadFilter();
      flt.type='bandpass'; flt.frequency.value=s.ff||800; flt.Q.value=s.fq||2;
      src.connect(flt); flt.connect(gn); src.start(0,0,s.dur||0.2);
    } else {
      var o=ctx.createOscillator(); o.type=s.t; o.frequency.value=s.f;
      if(s.f2) o.frequency.linearRampToValueAtTime(s.f2, now+(s.dur||0.1));
      o.connect(gn); o.start(now); o.stop(now+(s.dur||0.1));
    }
  }

  function startMusic(){
    if(!ctx||drone) return;
    if(ctx.state==='suspended') ctx.resume();
    dGain=ctx.createGain(); dGain.gain.value=0.025; dGain.connect(mg);
    drone=ctx.createOscillator(); drone.type='sine'; drone.frequency.value=73.42;
    drone.connect(dGain); drone.start();
    mNext=0; mTime=ctx.currentTime;
    _sched(); mTimer=setInterval(_sched, TICK);
  }

  function _sched(){
    if(!ctx) return;
    var now=ctx.currentTime;
    while(mTime<now+AHEAD){
      var nt=MUSIC_NOTES[mNext%MUSIC_NOTES.length];
      var vol=(musicDuck>now)?0.012:0.03;
      var o=ctx.createOscillator(); o.type=nt.w||'sine'; o.frequency.value=nt.f;
      var ng=ctx.createGain();
      ng.gain.setValueAtTime(vol, mTime);
      ng.gain.exponentialRampToValueAtTime(0.001, mTime+BEAT*1.5);
      o.connect(ng); ng.connect(mg);
      o.start(mTime); o.stop(mTime+BEAT*1.5);
      if(mNext%2===0){
        var b=ctx.createOscillator(); b.type=nt.w||'sine'; b.frequency.value=nt.f/2;
        var bg=ctx.createGain(); bg.gain.setValueAtTime(vol*0.4,mTime); bg.gain.exponentialRampToValueAtTime(0.001,mTime+BEAT*1.5);
        b.connect(bg); bg.connect(mg); b.start(mTime); b.stop(mTime+BEAT*1.5);
      }
      mTime+=BEAT; mNext++;
      if(mNext%12===0) mTime+=BEAT;
    }
  }

  function stopMusic(){
    if(drone){ drone.stop(); drone=null; dGain=null; }
    if(mTimer){ clearInterval(mTimer); mTimer=null; }
    mNext=0;
  }

  function duckMusic(sec){
    if(!ctx) return;
    musicDuck=ctx.currentTime+sec;
    if(dGain){ var n=ctx.currentTime; dGain.gain.setValueAtTime(0.008,n); dGain.gain.linearRampToValueAtTime(0.025,n+sec); }
  }

  return { init:init, play:play, setMute:setMute, isMuted:isMuted, startMusic:startMusic, stopMusic:stopMusic, duckMusic:duckMusic };
})();

/* ── Message system constants ── */
const MSG_FADE_IN_FRAMES   = 180;
const MSG_FADE_OUT_FRAMES  = 180;
const MSG_MAX_QUEUE_DEPTH  = 5;
const MSG_CHARS_PER_FRAME  = 0.35;
const MSG_MIN_HOLD         = 90;
const MSG_MAX_HOLD         = 360;
const MSG_FOREVER_THRESHOLD = 99999;

/* ── Message queue system ── */
function calcDisplayDuration(text, providedDur) {
    const auto = Math.floor(text.length / MSG_CHARS_PER_FRAME);
    const dur = providedDur || MSG_MIN_HOLD_ACTUAL;
    return Math.min(MSG_MAX_HOLD_ACTUAL, Math.max(dur, auto));
}
function showMessage(txt, dur) {
    const isForever = (dur || 0) >= MSG_FOREVER_THRESHOLD;
    if (isForever) {
        messageQueue = [{ text: txt, hold: dur || MSG_FOREVER_THRESHOLD, phase: 'display', elapsed: 0 }];
        return;
    }
    if (messageQueue.length > 0 && messageQueue[0].text === txt) return;
    if (messageQueue.length < MSG_MAX_QUEUE_DEPTH) {
        messageQueue.push({ text: txt, hold: calcDisplayDuration(txt, dur), phase: 'fadeIn', elapsed: 0 });
    }
}

/* ── Transition with screen fade ── */
function _doTransition(toChamber){
  P.chamber = toChamber;
  const nc = chambers[toChamber];
  P.x = nc.spawnPx; P.y = nc.spawnPy;
 P.respawnX = nc.spawnPx; P.respawnY = nc.spawnPy;
  P.vx=0; P.vy=0; P.jumps=0;
  fullDashReset();
  P.onGround=false; P.coyoteTime=0;
  P.pushing=false;
  resetPushBlock();
}
function transition(toChamber){
  if(animState!=='idle') return; // don't interrupt death/respawn
  _transitionTarget = toChamber;
  screenFade = 1;
  screenAlpha = 0;
}

function checkDoors(){
  const ch=P.chamber, c=chambers[ch];
  const {gx, gy} = playerGridPos();
  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
    const t=_getTile(gx+dx,gy+dy);
    if(t===DOOR_D){
      /* Return from test chamber (no flowId) */
      if(!c.flowId && testChamberSrc >= 0){
        transition(testChamberSrc);
        return;
      }
      /* Follow flow for main chambers */
      if(collectedGlyphs[ch]){
        const fi = CHAMBER_FLOW.indexOf(c.flowId);
        if(fi >= 0 && fi < CHAMBER_FLOW.length - 1){
          /* Find chamber index by flowId of next in flow */
          const nextFlow = CHAMBER_FLOW[fi+1];
          for(let i=0;i<chambers.length;i++){
            if(chambers[i].flowId === nextFlow){ transition(i); return; }
          }
        }
      } else {
        if(portalLockMsg<=0){
          showMessage("Truth must be earned.", 70);
          portalLockMsg = 45;
        }
      }
      return;
    }
    if(t===END_PORTAL){
      transitionEnding();
      return;
    }
  }
}

function checkGlyphs(){
  const ch=P.chamber, c=chambers[ch];
  if(collectedGlyphs[ch]) return;
  const {gx, gy} = playerGridPos();
  for(let i=0;i<c.glyphs.length;i++){
    const gl=c.glyphs[i];
    if(_getTile(gl.x,gl.y)!==GLYPH) continue;
    if(Math.abs(gx-gl.x)<=1 && Math.abs(gy-gl.y)<=1){
      if(glyphsCollected!==ch) continue;
      setTile(ch,gl.x,gl.y,AIR);
      collectedGlyphs[ch]=true;
      glyphsCollected++;
     Particles.spawn((gl.x+0.5)*T,(gl.y+0.5)*T, PARTICLE_COLORS.glyph, 15, 'star');
      Sound.play('glyph');
      const gi = glyphsCollected - 1;
      if(gi >= 0 && gi < GLYPH_EFFECTS.length){
        GLYPH_EFFECTS[gi].set();
        showMessage(GLYPH_EFFECTS[gi].msg, 120);
        showMessage("Ability: " + GLYPH_EFFECTS[gi].name, 120);
      }
    }
  }
}

function transitionEnding(){
  if(animState!=='idle') return;
  endingBeat = 0;
  endingStartTime = performance.now();
  gameState='ending';
  Sound.stopMusic();
  screenFade=1; screenAlpha=0;
  frozenElapsedSec = Math.round((Date.now()-gameStartTime)/1000);
}

/* ══════════════════════════════════════════════════
   9. UPDATE — physics, input, game logic
   ══════════════════════════════════════════════════ */
function update(){
  /* Pause toggle (P-key, fresh edge detection) — checked before guards */
  if((gameState==='playing'||gameState==='paused') && fresh('KeyP')){
    togglePause();
  }

  if(gameState==='title'){ syncPrevKeys(); return; }
  if(gameState==='paused'){ syncPrevKeys(); return; }
  if(gameState==='ending'){ syncPrevKeys(); return; }
  if(animState!=='idle'){ updateAnim(); return; }
  _c=chambers[P.chamber]; // cache chamber ref for fast getTile

 /* Test chamber entry/exit — press T */
  if(fresh('KeyT')){
    const c = chambers[P.chamber];
    if(!c.flowId && testChamberSrc >= 0){
      /* Return from test chamber */
      transition(testChamberSrc);
      showMessage("Back to chamber " + testChamberSrc + ".", 60);
    } else {
      /* Enter test chamber */
      testChamberSrc = P.chamber;
      glyphsCollected = 4;
      P.maxJumps = 2;
      P.canDash = true;
      P.canPush = true;
      P.canBreak = true;
      /* Find test chamber by absence of flowId */
      for(let i=0;i<chambers.length;i++){
        if(!chambers[i].flowId){ transition(i); break; }
      }
      showMessage("Test chamber — all abilities unlocked.", 90);
    }
    return;
  }

  /* Screen fade */
 if(screenFade===1){ screenAlpha+=0.06; if(screenAlpha>=1){screenAlpha=1; if(_transitionTarget>=0){_doTransition(_transitionTarget);_c=chambers[P.chamber];_transitionTarget=-1;} screenFade=-1;} }
  if(screenFade===-1){ screenAlpha-=0.06; if(screenAlpha<=0){screenAlpha=0;screenFade=0;} }
 if(screenFade===1){ syncPrevKeys(); return; }

  advanceTimers();

  /* ── Dash: charge on hold, execute on release ── */
  const isCharging = P.dashCharge > 0;

  /* ── Horizontal input (acceleration + friction) ── */
  let inputX = 0;
  if(inputLeft()) inputX=-1;
  if(inputRight()) inputX=1;
  if(inputX!==0 && P.facing!==inputX && P.onGround){ P.turnLean=8; P.lastFacing=P.facing; }
  if(inputX!==0) P.facing=inputX;  /* facing always updates — allows aiming dash */

  if(!isCharging && !P.dashing){
    if(inputX!==0){
      P.vx += inputX * (P.onGround ? H_ACCEL_GROUND : H_ACCEL_AIR);
      if(Math.abs(P.vx)>TERMINAL_VEL) P.vx = inputX*TERMINAL_VEL;
    } else {
      if(P.vx>0) P.vx = Math.max(0, P.vx-H_FRICTION);
      else if(P.vx<0) P.vx = Math.min(0, P.vx+H_FRICTION);
    }
  }

  if(isCharging){
    /* Charging state: gravity and velocity heavily slowed (1/10th) */
    P.vy = P.vy * 0.1 + 0.007;  /* 1/10th existing velocity + 1/10th normal gravity */
    P.vx *= CHARGE_FRICTION;

    if(!shiftHeld()){
      /* Shift released — execute dash */
     const chargeRatio = P.dashCharge / DASH_CHARGE_MAX_ACTUAL;
      const dashDist = DASH_DISTANCE_MIN + (DASH_DISTANCE_MAX - DASH_DISTANCE_MIN) * chargeRatio;
      const moveFrames = DASH_DURATION_ACTUAL;
      const dashSpeed = dashDist / moveFrames;

      P.dashing = true;
      P.dashTimer = DASH_DURATION_ACTUAL;
      P.dashDir = P.facing;
      P.dashPhase = true;
      P.dashCharge = 0;

      P.vx = P.dashDir * dashSpeed;
      P.vy = 0;

    Particles.spawn(P.x+P.w/2, P.y+P.h/2, PARTICLE_COLORS.dashBurst, 6, 'circle');
      Sound.play('dash');
    } else {
      /* Still holding — accumulate charge */
      if(P.dashCharge < DASH_CHARGE_MAX_ACTUAL){
        P.dashCharge++;
      }
      /* Charge particles */
      Particles.spawn(P.x+P.w/2, P.y+P.h/2, DASH_CHARGE_PARTICLE_COLOR, 2, 'circle');
    }
 } else if(P.canDash && !P.dashing && P.dashCooldown<=0){
    /* Start charging on Shift press or hold */
    if(shiftHeld()){
      P.dashCharge = 1;  /* Start charging — at least 1 frame */
    }
  }

 /* Dash execution */
  if(P.dashing){
    P.vx = P.dashDir * (P.vx !== 0 ? Math.abs(P.vx) : 10);
    P.vy = 0;
    P.dashTimer--;
    Particles.spawn(P.x+P.w/2, P.y+P.h/2, DASH_EXEC_PARTICLE_COLOR, 2, 'circle');
    if(!P._dashSfx || P.dashTimer % 3 === 0){ Sound.play('dashWhoosh'); P._dashSfx = true; }
    if(P.dashTimer<=0){
      endDash();
      const cx=Math.floor((P.x+P.w/2)/T), cy=Math.floor((P.y+P.h/2)/T);
      if(_getTile(cx,cy)===MAGICAL_WALL){
        killAndRespawn("The boundary rejects the unfinished.", 90);
      }
    }
  }
  if(P.dashCooldown>0) P.dashCooldown--;

  /* ── Gravity (only when airborne) ── */
  if(!isCharging && !P.onGround){
    P.vy += GRAVITY;
  }
  if(P.vy>TERMINAL_VEL) P.vy=TERMINAL_VEL;

 /* ── Coyote time countdown ── */
  const coyoteWasActive = P.coyoteTime > 0;
  if(coyoteWasActive) P.coyoteTime--;
   /* Airborne clay trail (Phase 4.5) -- removed to reduce visual clutter */

/* ── Move X + collide (tiles first, then push-block entity) ── */
  P.pushing = false;
  P._pushF = P._pushF || 0;
  const prevX = P.x;
  P.x += P.vx;

  /* 1. Resolve against static tiles */
  {
    const gx1=Math.floor(P.x/T), gx2=Math.floor((P.x+P.w-1)/T);
    const gy1=Math.floor(P.y/T), gy2=Math.floor((P.y+P.h-1)/T);
    const colFn = P.dashPhase ? collidesDash : collidesNoPlat;
    if(colFn(gx1,gy1,gx2,gy2,P.chamber,P.y)){
     if(P.dashPhase){
        const fcx=Math.floor((P.x+(P.vx>0?P.w:0))/T), fcy=Math.floor((P.y+P.h/2)/T);
        if(_getTile(fcx,fcy)===CRACKED && P.canBreak){
          setTile(P.chamber,fcx,fcy,AIR);
         Particles.shatter((fcx+0.5)*T,(fcy+0.5)*T);
          Sound.play('break');
          endDash();
        } else {
          snapToTileX(gx1, gx2, prevX);
          endDash();
        }
      } else {
        snapToTileX(gx1, gx2, prevX);
      }
      P.vx=0;
    }
  }

/* 2. Resolve against push-block entity */
  resolvePushBlockCollision();

  /* 3. Push block physics + crush check (before player Y) */
  updatePushBlock();

 /* ── Move Y + collide (platforms = one-way) ── */
  const prevY = P.y;
  P.y += P.vy;
  {
    const gx1=Math.floor(P.x/T), gx2=Math.floor((P.x+P.w-1)/T);
    const gy1=Math.floor(P.y/T), gy2=Math.floor((P.y+P.h)/T);
    const colFn = P.dashPhase ? collidesDash : collides;
  if(colFn(gx1,gy1,gx2,gy2,P.chamber,prevY,P.y)){
     if(P.vy>0){
        P.y=gy2*T-P.h;
        P.vy=0;
        land();
        P.landSquish=10;
      Particles.spawn(P.x+P.w/2, P.y+P.h, PARTICLE_COLORS.jump, 2, 'diamond');
        Sound.play('land');
      } else if(P.vy<0){
        P.y=(gy1+1)*T;
        P.vy=0;
      }
    } else {
      P.onGround = false;
    }
 /* Push block Y collision — land on top */
    for(const pb of PBlocks){
      if(pb.active && aabb(P.x, P.y, P.w, P.h, pb.x, pb.y, pb.w, pb.h) && P.vy > 0 && Math.abs(P.vx) < 3){
        if(prevY + P.h <= pb.y + 2){
         P.y = pb.y - P.h;
          P.vy = 0;
          const justLanded = prevY + P.h < pb.y;
          land();
        if(justLanded){
            Particles.spawn(P.x+P.w/2, P.y+P.h, PARTICLE_COLORS.jump, 2, 'diamond');
            Sound.play('land');
          }
        }
      }
    }
  }

  /* Crush check — after player Y + landing snap, so P.y is resolved */
  checkPushBlockCrush();

  /* ── Jump buffer countdown ── */
  if(P.jumpBuffer>0 && !P.onGround) P.jumpBuffer--;

  /* ── Jump (fresh press only, variable height, buffered) ── */
  const jumpPressed = inputJumpPressed();
  const jumpHeld = inputJumpHeld();
  const jx=P.x+P.w/2, jy=P.y+P.h; // precompute jump particle coords

  if(P.onGround && P.jumpBuffer>0 && P.jumps<P.maxJumps){
    P.vy = P.jumps===0 ? JUMP_VEL_1 : JUMP_VEL_2;
    P.jumps++;
    P.onGround=false;
    P.coyoteTime=0;
    P.jumpBuffer=0;
     Particles.spawn(jx, jy, PARTICLE_COLORS.jump, 5, 'diamond');
      Sound.play('jump');
  }
  else if(jumpPressed && P.jumps===0 && P.coyoteTime>0){
    P.vy = JUMP_VEL_1;
    P.jumps++;
    P.onGround=false;
    P.coyoteTime=0;
    P.jumpBuffer=0;
   Particles.spawn(jx, jy, PARTICLE_COLORS.jump, 5, 'diamond');
    Sound.play('jump');
  }
  else if(jumpPressed && P.jumps < P.maxJumps && P.jumps>0){
    P.vy = JUMP_VEL_2;
    P.jumps++;
    P.jumpBuffer=0;
   Particles.spawn(jx, jy, PARTICLE_COLORS.doubleJump, 8, 'star');
    Sound.play('jumpHi');
  }
  else if(jumpPressed && P.jumps < P.maxJumps){
    P.jumpBuffer = JUMP_BUFFER_ACTUAL;
  }

  /* Variable jump height: cut upward velocity on release */
  if(!jumpHeld && P.vy < JUMP_CUT_VEL) P.vy = JUMP_CUT_VEL;

  /* ── Pit / out-of-bounds death ── */
if(inPit() || P.y > chambers[P.chamber].h*T){
    cancelDash();
    killAndRespawn("Clay returns to dust.", 90);
    resetPushBlock();
  }

  checkDoors();
  checkGlyphs();
 Particles.update();

  syncPrevKeys();
}

/* ══════════════════════════════════════════════════
   9.5. ANIMATION STATE MACHINE (death/respawn animations)
   ══════════════════════════════════════════════════ */
function updateAnim(){
  _c = chambers[P.chamber]; // keep chamber cache valid for render
  advanceTimers();
  Particles.update();
  animFrame++;
 const progress = animFrame / ANIM_TOTAL_ACTUAL;
 // Dying -> transition to respawning
  if(animState==='dying' && animFrame>=ANIM_TOTAL_ACTUAL){
    resetPlayerToRespawn();
    animState='respawning'; animFrame=0;
    showMessage('Clay reforms...', 60);
  }
// Respawning -> transition back to idle
  if(animState==='respawning' && animFrame>=ANIM_TOTAL_ACTUAL){
    resetPlayerToRespawn();
    P.onGround=true; P.coyoteTime=COYOTE_FRAMES_ACTUAL;
    fullDashReset();
    resetPushBlock();
  animState='idle'; animFrame=0;
    Sound.play('respawn');
  }
  syncPrevKeys();
}

/* ══════════════════════════════════════════════════
   10. RENDER
   ══════════════════════════════════════════════════ */
const COLORS = {
  bg:'#12121F', wall:'#222233', wallTop:'#3A3A52',
  wallCapstone:'rgba(197,179,145,0.60)',
  platform:'#42425C', pit:'#060608',
  glyph:'#C5B391', glyphGlow:'rgba(197,179,145,0.45)',
  cracked:'#2E2840',
  golem:'#A89B8E', golemDark:'#4A4858', golemEye:'#C5B391',
 text:'#E8E8F0', pushBlock:'#2E2E44', pushBlockTop:'#454560'
};

/* ── Shared golem sprite renderer ── */
function drawGolemSprite(ctx, px, py, opts) {
  opts = opts || {};
  const pw = opts.pw !== undefined ? opts.pw : P.w;
  const ph = opts.ph !== undefined ? opts.ph : P.h;
  const facing = opts.facing || 1;
  const headOffY = opts.headOffY || 0;
  const alpha = opts.alpha !== undefined ? opts.alpha : 1;
  const showArms = opts.showArms !== false;
  const showFeet = opts.showFeet !== false;
  const showShadow = opts.showShadow !== false;
  const glow = opts.glow || 0;
  const scale = opts.scale || 1;
  const twoEyes = opts.twoEyes || false;

  ctx.save();
  ctx.globalAlpha = alpha;

  if (scale !== 1) {
    const cpx = px + pw/2, cpy = py + ph/2;
    ctx.translate(cpx, cpy);
    ctx.scale(scale, scale);
    ctx.translate(-cpx, -cpy);
  }

  if (glow > 0) {
    ctx.shadowColor = 'rgba(197,179,142,' + (glow * 0.5) + ')';
    ctx.shadowBlur = glow * 12;
  }

  if (showShadow) {
    ctx.fillStyle = COLORS.golemDark;
    ctx.fillRect(px+4, py+6, pw-8, ph-10);
  }

  ctx.fillStyle = COLORS.golem;
  ctx.fillRect(px+2, py+4, pw-4, ph-4);

  const hx = px+4, hy = py+headOffY, hw = pw-8, hh = 10, hr = 4;
  ctx.beginPath();
  ctx.moveTo(hx+hr, hy); ctx.lineTo(hx+hw-hr, hy);
  ctx.arcTo(hx+hw, hy, hx+hw, hy+hr, hr);
  ctx.lineTo(hx+hw, hy+hh); ctx.lineTo(hx, hy+hh);
  ctx.lineTo(hx, hy+hr);
  ctx.arcTo(hx, hy, hx+hr, hy, hr);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = COLORS.golemEye;
  ctx.fillRect(facing > 0 ? px+14 : px+6, py+3+headOffY, 4, 3);

  if (twoEyes) {
    ctx.fillRect(facing > 0 ? px+6 : px+14, py+3+headOffY, 4, 3);
  }

  if (showFeet) {
    ctx.fillStyle = COLORS.golemDark;
    ctx.beginPath();
    ctx.moveTo(px+3,py+ph-4); ctx.lineTo(px+10,py+ph-4);
    ctx.lineTo(px+12,py+ph); ctx.lineTo(px+1,py+ph);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(px+pw-10,py+ph-4); ctx.lineTo(px+pw-3,py+ph-4);
    ctx.lineTo(px+pw-1,py+ph); ctx.lineTo(px+pw-12,py+ph);
    ctx.closePath(); ctx.fill();
  }

  if (showArms) {
    ctx.fillStyle = COLORS.golem;
    ctx.fillRect(px-1, py+10, 3, 10);
    ctx.fillRect(px+pw-2, py+10, 3, 10);
  }

  ctx.restore();
}

/* ── Death/Respawn animation renderer ── */
function renderDeathRespawnAnimation(ox, oy){
  const now = Date.now();
 const progress = animFrame / ANIM_TOTAL_ACTUAL;
  const cx = ox + P.respawnX + P.w/2;
  const cy = oy + P.respawnY + P.h/2;
  const pw = P.w, ph = P.h;

  if(animState === 'dying'){
    // ── DEATH: parts spread outward with gravity, alpha fades, clay particles ──
    const p = easeOutCubic(progress);
    const alpha = 1 - progress;
    const spread = p * 80;

    // Spawn clay particles during first half
    if(animFrame % 4 === 0 && progress < 0.6){
      Particles.spawn(P.x + P.w/2, P.y + P.h/2, PARTICLE_COLORS.death, 2);
    }

    X.save();
    X.globalAlpha = Math.max(0, alpha);

    // Head (spreads up)
    const headY = cy - ph/2 - spread * 0.8;
    X.fillStyle = COLORS.golem;
    X.fillRect(cx - pw/4 + Math.sin(animFrame*0.3)*spread*0.2, headY - 5, pw/2, 10);
    // Eye on head
    X.fillStyle = COLORS.golemEye;
    X.fillRect(cx + 2 + Math.sin(animFrame*0.3)*spread*0.2, headY - 2, 4, 3);

    // Torso (spreads center, slight rotation wobble)
    const torsoY = cy + spread * 0.1;
    const torsoOffX = Math.cos(animFrame*0.4)*spread*0.15;
    X.fillStyle = COLORS.golemDark;
    X.fillRect(cx - pw/3 + torsoOffX, torsoY - ph/3, pw*2/3, ph*2/3);
    X.fillStyle = COLORS.golem;
    X.fillRect(cx - pw/4 + torsoOffX, torsoY - ph/3 + 2, pw/2, ph*2/3 - 4);

    // Left arm (spreads left)
    const armY = cy + spread * 0.3 + Math.sin(animFrame*0.5)*spread*0.2;
    X.fillStyle = COLORS.golem;
    X.fillRect(cx - spread - 3, armY, 3, 10);

    // Right arm (spreads right)
    const arm2Y = cy + spread * 0.3 - Math.sin(animFrame*0.5)*spread*0.2;
    X.fillRect(cx + spread, arm2Y, 3, 10);

    // Legs (spread outward and down with gravity)
    const legY = cy + ph/2 + spread * 0.5;
    X.fillStyle = COLORS.golemDark;
    X.fillRect(cx - spread*0.7, legY, 7, 4);
    X.fillRect(cx + spread*0.7 - 7, legY, 7, 4);

    X.restore();

  } else if(animState === 'respawning'){
    // ── RESPAWN: parts materialize bottom-up (legs->arms->torso->head->eye->glyphs) ──
    const p = progress;
    const flash = p > 0.9 ? (p - 0.9) / 0.1 : 0; // final activation flash

    // Spawn reforming particles during first 60%
    if(animFrame % 3 === 0 && progress < 0.6){
     Particles.spawn(P.respawnX + P.w/2 + (Math.random()-0.5)*30,
                       P.respawnY + P.h + (Math.random()-0.5)*20, PARTICLE_COLORS.death, 2);
    }

    // Clay pile at feet — shrinks as golem forms
    const pileSize = (1 - easeOutCubic(Math.min(1, p * 2))) * 15;
    if(pileSize > 1){
      X.fillStyle = 'rgba(168,155,142,' + (1 - p) * 0.5 + ')';
      X.beginPath();
      X.ellipse(cx, oy + P.respawnY + P.h + 2, pileSize + 5, pileSize/2, 0, 0, Math.PI*2);
      X.fill();
    }

    X.save();

    // Legs appear first (0-15%)
    if(p > 0.05){
      const legAlpha = Math.min(1, (p - 0.05) / 0.15);
      X.globalAlpha = legAlpha;
      X.fillStyle = COLORS.golemDark;
      X.fillRect(cx - pw/2 + 3, oy + P.respawnY + ph - 4, 7, 4);
      X.fillRect(cx + pw/2 - 10, oy + P.respawnY + ph - 4, 7, 4);
    }

    // Arms appear next (15-30%)
    if(p > 0.2){
      const armAlpha = Math.min(1, (p - 0.2) / 0.15);
      X.globalAlpha = armAlpha;
      X.fillStyle = COLORS.golem;
      X.fillRect(cx - pw/2 - 1, oy + P.respawnY + 10, 3, 10);
      X.fillRect(cx + pw/2 - 2, oy + P.respawnY + 10, 3, 10);
    }

    // Torso (30-50%)
    if(p > 0.35){
      const torsoAlpha = Math.min(1, (p - 0.35) / 0.15);
      X.globalAlpha = torsoAlpha;
      X.fillStyle = COLORS.golemDark;
      X.fillRect(cx - pw/2 + 4, oy + P.respawnY + 6, pw - 8, ph - 10);
      X.fillStyle = COLORS.golem;
      X.fillRect(cx - pw/2 + 2, oy + P.respawnY + 4, pw - 4, ph - 4);
    }

    // Head (50-65%)
    if(p > 0.5){
      const headAlpha = Math.min(1, (p - 0.5) / 0.15);
      X.globalAlpha = headAlpha;
      X.fillStyle = COLORS.golem;
      X.fillRect(cx - pw/4, oy + P.respawnY, pw/2, 10);
    }

    // Eye (65-75%)
    if(p > 0.65){
      const eyeAlpha = Math.min(1, (p - 0.65) / 0.1);
      X.globalAlpha = eyeAlpha;
      X.fillStyle = COLORS.golemEye;
      X.fillRect(cx + 2, oy + P.respawnY + 3, 4, 3);
    }

    // Glyph lines (75-90%)
    if(p > 0.75){
      const glyphAlpha = Math.min(1, (p - 0.75) / 0.15);
      X.globalAlpha = glyphAlpha * (0.3 + Math.sin(now/500)*0.15);
      X.fillStyle = COLORS.golemEye;
      for(let i = 0; i < glyphsCollected; i++){
        X.fillRect(cx - pw/2 + 8, oy + P.respawnY + 12 + i*4, 8, 1);
      }
    }

    // Final activation flash (90-100%)
    if(flash > 0){
      X.globalAlpha = flash * 0.3;
      X.fillStyle = '#C5B391';
      X.beginPath();
      X.arc(cx, cy, (pw + ph) * flash * 0.8, 0, Math.PI*2);
      X.fill();
    }

    X.restore();
  }
}

function render(){
  const now=Date.now(); // B1: cache time once per frame
  const ch=P.chamber, c=chambers[ch];
  _c=c; // cache for fast getTile
  const glyphCollected=collectedGlyphs[ch]; // A8: cache lookup

  X.fillStyle=COLORS.bg; X.fillRect(0,0,W,H);

  const orbitPhase = Math.min(endSec / orbitEnd, 1); // 0→1 over orbit

  // Speed ramps: slow start, accelerates after 2s (B2)
  const speedPhase = Math.min(Math.max((endSec - B2) / 1, 0), 1); // 0-1 over [2,3]
  const orbitRate = lerp(0.6, 2.2, easeOutCubic(speedPhase));

  // Center shifts from (cx,cy) toward (cx, cy-30) starting at B2
  const centerPhase = Math.min(Math.max((endSec - B2) / 2, 0), 1);
  const orbitCX = cx;
  const orbitCY = lerp(cy, cy - 30, easeOutCubic(centerPhase));

  // Radius shrinks from ~50 to ~35 starting at B2
  const radius = lerp(50, 35, easeOutCubic(centerPhase));

  /* ── Phase B: Convergence (5-7.5s) ── */
  const convergeStart = B3;
  const convergeDur = B4 - convergeStart; // 9 - 5 = 4s, but glyphs converge in first 2.5s
  const rawConverge = Math.min(Math.max((endSec - convergeStart) / 2.5, 0), 1);
  convergeProgress = rawConverge;
  const easedConverge = easeOutQuint(rawConverge);

  /* ── Compute glyph positions ── */
  for (let i = 0; i < 4; i++) {
    // Orbit position (deterministic, uses endSec not Date.now())
    const angle = (i / 4) * PI2 + endSec * orbitRate;
    const ox = cx + Math.cos(angle) * radius;
    const oy = orbitCY + Math.sin(angle) * radius;

    // EMET target positions: Aleph/Mem/Tav spread across center
    // RTL: \u05ea\u05de\u05d0 (Tav right, Mem center, Aleph left)
    const letterSpacing = 20;
    const targetX = cx + (i - 1.5) * letterSpacing; // Aleph=-30, Mem=-10, He=+10, Tav=+30
    const targetY = emetY;

    let x, y, alpha;

    if (rawConverge <= 0) {
      // Pure orbit
      x = ox; y = oy; alpha = 0.6 + Math.sin(endSec / 300) * 0.3 + 0.1;
    } else if (rawConverge < 1) {
      // Converging: lerp from orbit to target
      x = lerp(ox, targetX, easedConverge);
      y = lerp(oy, targetY, easedConverge);
      // He (index 2) dissolves starting at converge=0.5
      if (i === 2) {
        alpha = 1 - easeOutCubic(Math.min((rawConverge - 0.4) / 0.6, 1));
      } else {
        alpha = lerp(1, 0, easeOutCubic(Math.max((rawConverge - 0.7) / 0.3, 0)));
      }
    } else {
      // Converged
      x = targetX; y = targetY;
      alpha = (i === 2) ? 0 : 0; // All faded, He gone first
    }

    glyphs.push({ x, y, alpha: Math.max(0, alpha) });
  }

  /* ── EMET cross-fade (starts at converge=0.6) ── */
  if (rawConverge >= 0.6) {
    emetAlpha = easeOutCubic(Math.min((rawConverge - 0.6) / 0.4, 1));
  }

  /* ── Phase C: Flash bloom (Gaussian bell at converge≈0.7) ── */
  const flashCenter = 0.7, flashWidth = 0.15;
  const flashT = (rawConverge - flashCenter) / flashWidth;
  flashAlpha = Math.exp(-flashT * flashT) * 0.25;

  /* ── Phase 4: Font size smoothing ── */
  emetFontSize = lerp(24, 28, easeOutCubic(Math.min(Math.max((rawConverge - 0.5) / 0.5, 0), 1)));

  /* ── Phase D: Glow (7.5s+) — EMET persists at full brightness ── */
  if (endSec >= B3 + 2.5) {
    const glowPhase = Math.min((endSec - (B3 + 2.5)) / 1.5, 1);
    const baseGlow = easeOutCubic(glowPhase) * 0.7;
    const pulse = Math.sin(endSec / 0.4) * 0.15;
    emetGlowIntensity = Math.max(baseGlow, baseGlow + pulse);
  }

  return { glyphs, emetAlpha, emetFontSize, emetGlowIntensity, emetY, flashAlpha, convergeProgress };
}

if (gameState === 'ending') {
    /* Screen fade */
    if(screenFade>0){
      screenAlpha=Math.min(screenAlpha+0.03,1);
      if(screenAlpha>=1) screenFade=0;
    }

    /* Wall-clock progression */
    const endSec = (performance.now() - endingStartTime) / 1000;
    const fi = ENDING.FADE_IN, ho = ENDING.HOLD, fo = ENDING.FADE_OUT;

    if(endSec < ENDING.BEAT_2) endingBeat = 1;
    else if(endSec < ENDING.BEAT_3) endingBeat = 2;
    else if(endSec < ENDING.BEAT_4) endingBeat = 3;
    else if(endSec < ENDING.BEAT_5) endingBeat = 4;
    else if(endSec < ENDING.BEAT_6) endingBeat = 5;
    else endingBeat = 6;

    /* Background */
    const fadeAlpha = Math.min(endSec/2, 0.95);
    X.fillStyle='rgba(10,10,18,'+fadeAlpha+')';
    X.fillRect(0,0,W,H);
    X.fillStyle='rgba(21,21,37,0.5)';
    for(const [sx,sy] of c.stars) X.fillRect(sx,sy,1,1);

    /* Center golem */
    const cx = W/2, cy = H/2 - 40;
    const golemAlpha = Math.min(endSec/0.7, 1);
    const epw = P.w, eph = P.h;
    const epx = cx - epw/2, epy = cy - eph/2;
    drawGolemSprite(X, epx, epy, {
      alpha: golemAlpha, facing: 1, twoEyes: true, glow: 0.4, scale: 2
    });

    const allGlyphs = ['\u05d0', '\u05de', '\u05d4', '\u05ea'];

    /* Unified ending renderer — continuous glyph/EMET state */
    const state = getEndingGlyphState(endSec, cx, cy);

    /* Flash bloom overlay */
    if (state.flashAlpha > 0.01) {
      X.fillStyle = 'rgba(197,179,142,' + state.flashAlpha + ')';
      X.fillRect(0, 0, W, H);
    }

    /* Individual glyphs (Hebrew RTL) */
    X.font = FONT_HEBREW; X.textAlign = 'center'; X.textBaseline = 'middle';
    X.direction = 'rtl';
    for (let i = 0; i < 4; i++) {
      const g = state.glyphs[i];
      if (g.alpha > 0.01) {
        X.fillStyle = 'rgba(197,179,142,' + g.alpha + ')';
        X.fillText(allGlyphs[i], g.x, g.y);
      }
    }
    X.direction = 'ltr';

    /* EMET word (Hebrew RTL) */
    if (state.emetAlpha > 0.01) {
      X.font = state.emetFontSize + 'px "Segoe UI", "Arial Hebrew", "David", serif';
      X.textAlign = 'center'; X.textBaseline = 'middle';
      if (state.emetGlowIntensity > 0.01) {
        X.shadowColor = 'rgba(197,179,142,' + state.emetGlowIntensity + ')';
        X.shadowBlur = 10;
      }
      X.direction = 'rtl';
      X.strokeStyle = 'rgba(10,10,18,' + (state.emetAlpha * 0.8) + ')';
      X.lineWidth = 3;
      X.strokeText('\u05d0\u05de\u05ea', cx, state.emetY);
      X.fillStyle = 'rgba(197,179,142,' + (state.emetAlpha * 0.9) + ')';
      X.fillText('\u05d0\u05de\u05ea', cx, state.emetY);
      X.shadowBlur = 0;
      X.direction = 'ltr';
    }

    /* Message — exclusive to beat 2, different Y to avoid overlap */
    if (endingBeat === 2) {
      const msgAlpha = captionAlphaSec(endSec, ENDING.BEAT_2 + 0.3, fi, ho, fo);
      if (msgAlpha > 0) {
        X.shadowColor = 'rgba(0,0,0,0.7)'; X.shadowBlur = 4;
        X.fillStyle = 'rgba(232,232,240,' + msgAlpha + ')';
        X.font = FONT_DISPLAY;
        X.fillText('The four glyphs converge.', W / 2, H - 155);
        X.shadowBlur = 0;
      }
    }

    /* Message — exclusive to beat 3, different Y from beat 2 */
    if (endingBeat === 3) {
      const msgAlpha2 = captionAlphaSec(endSec, ENDING.BEAT_3 + 0.3, fi, ho, fo);
      if (msgAlpha2 > 0) {
        X.shadowColor = 'rgba(0,0,0,0.7)'; X.shadowBlur = 4;
        X.fillStyle = 'rgba(232,232,240,' + msgAlpha2 + ')';
        X.font = FONT_DISPLAY;
        X.fillText('EMET \u2014 Truth \u2014 inscribes itself upon the forehead of clay.', W / 2, H - 130);
        X.shadowBlur = 0;
      }
    }

    /* Ibis lines — fade in then persist through end */
    if (endingBeat >= 4) {
      const ibisLines = [
        { text: 'The Ibis watches. What Thoth began, the clay completed itself.', y: H - 155, start: ENDING.BEAT_4 + 0.5 },
        { text: 'You walked the path of initiation.', y: H - 130, start: ENDING.BEAT_4 + 2.0 },
        { text: 'You are the Golem of Truth.', y: H - 105, start: ENDING.BEAT_4 + 3.5 },
      ];
      X.font = FONT_DISPLAY;
      X.textAlign = 'center';
      for (const line of ibisLines) {
        const a = Math.min((endSec - line.start) / 0.6, 1);
        if (a > 0) {
          X.shadowColor = 'rgba(0,0,0,0.7)'; X.shadowBlur = 4;
          X.fillStyle = 'rgba(232,232,240,' + a + ')';
          X.fillText(line.text, W / 2, line.y);
          X.shadowBlur = 0;
        }
      }
    }

    /* Beat 5: Stats */
    if(endingBeat >= 5){
      const statsAlpha = easeOutCubic(Math.max(0, Math.min((endSec - ENDING.BEAT_4)/0.5, 1)));
      X.fillStyle='rgba(161,143,117,'+statsAlpha+')';
      X.font=FONT_UI;
      X.fillText('Time: '+frozenElapsedSec+'s  |  Deaths: '+totalDeaths, W/2, H-55);
    }

    /* Beat 6: Play Again */
    if(endingBeat >= 6){
      const btnAlpha = easeOutCubic(Math.max(0, Math.min((endSec - ENDING.BEAT_5)/0.5, 1)));
      const btnX = W/2-60, btnY = H-30, btnW = 120, btnH = 28;
      X.strokeStyle='rgba(92,179,175,'+btnAlpha+')';
      X.lineWidth=2;
      X.strokeRect(btnX,btnY,btnW,btnH);
      X.fillStyle='rgba(92,179,175,'+btnAlpha+')';
      X.font=FONT_UI;
      X.textAlign='center'; X.textBaseline='middle';
      X.fillText('Play Again', W/2, btnY+btnH/2);
    }

  }
}

/* ── Title & Pause Menu functions (Phase 6/7) ── */

const titleScreen = document.getElementById('title-screen');
const pauseOverlay = document.getElementById('pause-overlay');

function restoreAllChambers(){
  chambers.forEach(c => {
    c.tiles = c.initialTiles.map(row => row.slice());
    c.solidTiles = [];
    for(let y=0; y<c.h; y++)
      for(let x=0; x<c.w; x++){
        if(c.tiles[y][x] !== AIR) c.solidTiles.push({x, y});
        if(c.tiles[y][x] === GOLEM_SPAWN){ c.spawnPx = x*T; c.spawnPy = y*T; }
      }
  });
}

function resetGameState(){
  if(animFrameId){ cancelAnimationFrame(animFrameId); }
  restoreAllChambers();
  P.x=chambers[0].spawnPx; P.y=chambers[0].spawnPy; P.vx=0; P.vy=0;
  P.onGround=false; P.jumps=0; P.maxJumps=1;
  P.canDash=false; P.dashing=false; P.dashTimer=0; P.dashDir=0; P.dashCooldown=0; P.dashPhase=false; P.dashCharge=0;
  P.canPush=false; P.canBreak=false;
  P.facing=1; P.chamber=0;
  P.coyoteTime=0; P.jumpBuffer=0; P.pushing=false;
  P.landSquish=0; P.turnLean=0; P.lastFacing=1;
  P.respawnX=chambers[0].spawnPx; P.respawnY=chambers[0].spawnPy;
  PBlocks.length=0;
  glyphsCollected=0;
  collectedGlyphs=new Array(chambers.length).fill(false);
  gameState='title';
  screenFade=0; screenAlpha=0;
  messageQueue.length=0;
  particles.length=0;
  portalLockMsg=0;
  testChamberSrc=-1;
  _c=undefined;
  _transitionTarget=-1;
 animState='idle'; animFrame=0;
 endingBeat=0;
  endingStartTime=performance.now();
  frozenElapsedSec=0;
  gameStartTime=undefined;
  totalDeaths=0;
  simAcc=0; lastSimTime=0;
  keys={}; prevKeys={};
}

function startGame(){
  gameState = 'playing';
  Sound.init();
  applyPace();
  lastSimTime = performance.now();
  Sound.startMusic();
  gameStartTime = Date.now();
  titleScreen.style.display = 'none';
  pauseOverlay.style.display = 'none';
  document.getElementById('hud-bar').style.display = 'flex';
  animFrameId = requestAnimationFrame(loop);
}

function togglePause(){
  if(gameState === 'playing'){
    gameState = 'paused';
    pauseOverlay.style.display = 'flex';
    Sound.stopMusic();
    simAcc = 0; lastSimTime = 0;
  } else if(gameState === 'paused'){
    gameState = 'playing';
    pauseOverlay.style.display = 'none';
    Sound.startMusic();
  }
}

function returnToMenu(){
  resetGameState();
  Sound.stopMusic();
  pauseOverlay.style.display = 'none';
  titleScreen.style.display = 'flex';
  document.getElementById('hud-bar').style.display = 'none';
}

/* Resume button */
document.getElementById('btn-resume').addEventListener('click', function(){
  if(gameState === 'paused') togglePause();
});

/* Return to menu button */
document.getElementById('btn-menu').addEventListener('click', function(){
  if(gameState === 'paused') returnToMenu();
});

/* Title screen: click to start (anywhere on overlay) */
titleScreen.addEventListener('click', function(e){
  if(gameState === 'title'){
    /* Prevent clicks on the THOLEM link from starting the game */
    if(e.target.id === 'tholem-link' || e.target.closest('#tholem-link') || e.target.id === 'github-link' || e.target.closest('#github-link')) return;
    if(e.target.id === 'btn-easy' || e.target.id === 'btn-hard') return;
    startGame();
  }
});

/* Pace toggle buttons */
const paceLabel = document.querySelector('.ts-pace-label');
const btnEasy = document.getElementById('btn-easy');
const btnHard = document.getElementById('btn-hard');

function updatePaceUI(){
  btnEasy.style.color = paceMode === 'easy' ? '#5CB3AF' : '#C5B391';
  btnEasy.style.borderColor = paceMode === 'easy' ? 'rgba(92,179,175,0.5)' : 'rgba(197,179,145,0.35)';
  btnHard.style.color = paceMode === 'hard' ? '#5CB3AF' : '#C5B391';
  btnHard.style.borderColor = paceMode === 'hard' ? 'rgba(92,179,175,0.5)' : 'rgba(197,179,145,0.35)';
  paceLabel.textContent = paceMode === 'easy' ? '144 Hz \u2014 slower, more forgiving' : '240 Hz \u2014 faithful to the original weight';
}

btnEasy.addEventListener('click', function(e){
  e.stopPropagation();
  if(paceMode !== 'easy'){ togglePace(); updatePaceUI(); }
});

btnHard.addEventListener('click', function(e){
  e.stopPropagation();
  if(paceMode !== 'hard'){ togglePace(); updatePaceUI(); }
});

/* ══════════════════════════════════════════════════
   11. INIT & GAME LOOP
   ══════════════════════════════════════════════════ */

/* ── Init ── */
collectedGlyphs = new Array(chambers.length).fill(false);

loadPace();
updatePaceUI();

/* B4: Precompute starfield per chamber */
chambers.forEach((c, i) => {
  c.stars = [];
  for(let j=0; j<40; j++)
    c.stars.push([(j*137+i*50)%W, (j*97+i*30)%H]);
});

/* B5: Build sparse render list — only non-AIR tiles need drawing */
chambers.forEach(c => {
  c.solidTiles = [];
  for(let y=0; y<c.h; y++)
    for(let x=0; x<c.w; x++){
     if(c.tiles[y][x] !== AIR) c.solidTiles.push({x, y});
      if(c.tiles[y][x] === GOLEM_SPAWN){ c.spawnPx = x*T; c.spawnPy = y*T; }
    }
});

/* Snapshot original grids — used to restore after menu reset */
chambers.forEach(c => { c.initialTiles = c.tiles.map(row => row.slice()); });

P.x=chambers[0].spawnPx; P.y=chambers[0].spawnPy;
P.respawnX=chambers[0].spawnPx; P.respawnY=chambers[0].spawnPy;
P.coyoteTime=0; P.onGround=false;
animState='respawning'; animFrame=0;
showMessage('The clay remembers it was shaped.', 150);

/* ── Play Again click handler (Phase 5 ending) ── */
C.addEventListener('click', function(e){
  if(gameState==='ending'){
    const rect = C.getBoundingClientRect();
    const clickX = (e.clientX - rect.left) * (W / rect.width);
    const clickY = (e.clientY - rect.top) * (H / rect.height);
    const endSec = (performance.now() - endingStartTime) / 1000;

    /* Skip forward after beat 3 */
    if(endSec > ENDING.BEAT_3 && endingBeat < 6){
      endingStartTime = performance.now() - ENDING.BEAT_5 * 1000;
      return;
    }

    if(endingBeat>=6){
      const btnX = W/2-60, btnY = H-30, btnW = 120, btnH = 28;
      if(clickX >= btnX && clickX <= btnX+btnW &&
         clickY >= btnY && clickY <= btnY+btnH){
        returnToMenu();
      }
    }
  }
});

/* ── Game loop ── */
function loop(ts){
  if(!lastSimTime) lastSimTime = ts;
  const dt = ts - lastSimTime;
  lastSimTime = ts;

  if(gameState === 'playing'){
    simAcc += dt;
    if(simAcc > 128) simAcc = 128;
    let ticks = 0;
    while(simAcc >= simDt && ticks < 8){
      update();
      simAcc -= simDt;
      ticks++;
    }
  }

  render();

  if(gameState==='playing'||gameState==='paused'||gameState==='ending'){
    animFrameId = requestAnimationFrame(loop);
  }
}
animFrameId = requestAnimationFrame(loop);

/* ── Responsive scaling (Phase 9) ── */
(function(){
  var gw = document.getElementById('game-wrapper');
  function applyScale(){
    var sx = window.innerWidth / 800;
    var sy = window.innerHeight / 512;
    var s = Math.min(sx, sy);
    gw.style.transform = 'scale(' + s.toFixed(4) + ')';
  }
  applyScale();
  window.addEventListener('resize', applyScale);
})();

</script>
